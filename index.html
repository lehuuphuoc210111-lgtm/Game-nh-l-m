<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Triệu Phú - Tổng Hợp Phiên Bản</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0c1033 0%, #05071a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(16, 22, 67, 0.8);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #00d2ff;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            margin-bottom: 30px;
        }
        p {
            color: #8fa0dd;
            margin-bottom: 40px;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .btn {
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #0f1746 0%, #16267d 100%);
            border: 1px solid #00d2ff;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .btn:hover {
            background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
            transform: translateY(-3px);
            box-shadow: 0 0 15px #00d2ff;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #5869a2;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GAME HUB</h1>
        <p>Vui lòng chọn phiên bản game bạn muốn trải nghiệm:</p>
        
        <div class="menu-buttons">
            <a href="game.html" class="btn">🚀 Tàu Vũ Trụ (Game 1)</a>
            <a href="game2.html" class="btn">💸 Ai Là Triệu Phú (vnđ) (Game 2)</a>
            <a href="game3.html" class="btn">🐺 Ma Sói Online (Game 3)</a>
        </div>

        <div class="footer">
            Ngân hàng câu hỏi cập nhật tự động • Không cần cài đặt
        </div>
    </div>

</body>
</html>
