<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hành Trình Tới Mặt Trời</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            background: #020617;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: white;
            transition: background 2s ease;
        }

        @media screen and (max-width: 900px) and (orientation: portrait) {
            #rotateMessage { display: flex !important; }
        }

        #rotateMessage {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #020617;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        #uiContainer {
            width: 95vw;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        #scoreBoard, #phaseBoard {
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }
        #phaseBoard { color: #38bdf8; transition: color 1s; }

        #gameCanvas {
            position: relative;
            width: 95vw;
            max-width: 800px;
            height: 320px;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            border: 3px solid #38bdf8;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
            transition: all 2s ease;
        }

        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            z-index: 10;
            transform: rotate(90deg);
            transition: transform 0.1s ease-out, width 0.5s, height 0.5s, opacity 0.5s;
        }

        .obstacle {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glow-effect { filter: drop-shadow(-6px 0px 5px #ef4444) drop-shadow(0px 0px 8px #f97316); }
        .sun-glow { filter: drop-shadow(0px 0px 20px #ef4444) drop-shadow(0px 0px 40px #f59e0b); }
        
        /* Hiệu ứng mờ ảo cho hố đen */
        .blackhole-glow {
            filter: drop-shadow(0px 0px 25px #a855f7) drop-shadow(0px 0px 50px #6366f1);
            animation: spin 6s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(-360deg); } }

        /* Cột lửa xuất hiện từ từ */
        .solar-flare-beam {
            position: absolute;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, transparent, #ff4500, #ffd700, #ff4500, transparent);
            box-shadow: 0 0 20px #ff4500;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        /* Thông báo vượt qua hệ mặt trời */
        #victoryAnnouncement {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.8);
            z-index: 30;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #facc15;
            text-shadow: 0 0 20px #e11d48;
            animation: pulseText 1.5s ease-in-out infinite alternate;
        }
        @keyframes pulseText { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

        #controlsArea {
            width: 95vw;
            max-width: 800px;
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }

        #joystickContainer {
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(56, 189, 248, 0.3);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystickKnob {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        button {
            background: #10b981; border: none; padding: 10px 24px;
            color: white; font-size: 15px; font-weight: bold;
            border-radius: 8px; cursor: pointer; margin-top: 10px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
        button:hover { background: #059669; }
    </style>
</head>
<body>

    <div id="rotateMessage">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
            <path d="M12 21A9 9 0 0 0 21 12H19A7 7 0 0 1 12 19V21Z"/>
            <path d="M21 12A9 9 0 0 0 12 3V5A7 7 0 0 1 19 12H21Z"/>
            <rect x="2" y="7" width="12" height="18" rx="2" transform="rotate(-90 2 7)" fill="none" stroke="#fff" stroke-width="2"/>
        </svg>
        <p style="font-size: 18px; font-weight: bold; margin-top: 15px;">Vui lòng xoay ngang màn hình thiết bị để chơi game!</p>
    </div>

    <div id="uiContainer">
        <div id="scoreBoard">Điểm: <span id="score">0</span> / 100</div>
        <div id="phaseBoard">Vùng: <span id="phaseText">Tầng Nhiệt</span></div>
    </div>
    
    <div id="gameCanvas">
        <div id="player">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <path d="M42 82 L50 98 L58 82 Z" fill="#ef4444" />
                <path d="M46 82 L50 92 L54 82 Z" fill="#f97316" />
                <path d="M48 70 L50 82 L52 70 Z" fill="#3b82f6" />
                <path d="M30 50 L8 72 L30 72 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />
                <path d="M70 50 L92 72 L70 72 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />
                <path d="M50 5 C72 42, 70 74, 68 78 C62 82, 38 82, 32 78 C30 74, 28 42, 50 5 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
                <path d="M50 5 C61 25, 39 25, 50 5 Z" fill="#dc2626" />
                <circle cx="50" cy="38" r="9" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
                <circle cx="47" cy="35" r="3" fill="#ffffff" opacity="0.7"/>
            </svg>
        </div>

        <div id="victoryAnnouncement">VƯỢT QUA HỆ MẶT TRỜI</div>
        
        <div id="gameOverScreen">
            <h1 id="winLoseTitle" style="color: #f43f5e; margin: 0; text-shadow: 0 0 15px rgba(244,63,94,0.4);">TÀU VŨ TRỤ BỊ PHÁ HỦY!</h1>
            <p style="font-size: 18px; margin: 10px 0;">Điểm số cuối cùng: <span id="finalScore">0</span></p>
            <button onclick="startGame()">Tái sinh tàu</button>
        </div>
    </div>

    <div id="controlsArea">
        <div id="joystickContainer">
            <div id="joystickKnob"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');
        const phaseText = document.getElementById('phaseText');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const winLoseTitle = document.getElementById('winLoseTitle');
        const victoryAnnounce = document.getElementById('victoryAnnouncement');
        const knob = document.getElementById('joystickKnob');
        const joystickZone = document.getElementById('joystickContainer');

        let canvasWidth = canvas.clientWidth;
        let canvasHeight = canvas.clientHeight;

        let playerX, playerY;
        const playerSize = 40;
        let playerSpeedX = 0, playerSpeedY = 0;
        const maxSpeed = 6.0; 

        let score = 0;
        let isGameOver = false;
        let isTransitioning = false; // Trạng thái đang chuyển cảnh hố đen
        let gameInterval, spawnInterval, sunAttackInterval;
        let obstacles = [];
        let sunObject = null;
        let blackHoleObject = null;

        const keys = { w: false, s: false, a: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        const VISUAL_ASSETS = {
            satellite: `<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="42" y="15" width="16" height="70" rx="4" fill="#94a3b8" stroke="#475569"/><rect x="5" y="32" width="32" height="16" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/><rect x="63" y="32" width="32" height="16" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/><circle cx="50" cy="40" r="10" fill="#cbd5e1"/></svg>`,
            spaceStation: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="24" fill="none" stroke="#94a3b8" stroke-width="5"/><rect x="10" y="44" width="80" height="12" fill="#475569" rx="2"/><circle cx="50" cy="50" r="14" fill="#e2e8f0" stroke="#475569"/></svg>`,
            meteor: `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M-15 50 Q15 -5 65 20 T100 55 T50 95 Z" fill="#ea580c"/><path d="M10 50 Q30 15 65 30 T85 60 T50 82 Z" fill="#78350f"/><path d="M-40 45 L15 25 L5 55 Z" fill="#f97316"/></svg>`,
            planets: [
                `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#dc2626"/><circle cx="32" cy="35" r="10" fill="#991b1b" opacity="0.5"/></svg>`, 
                `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#f59e0b"/><rect x="5" y="52" width="90" height="16" fill="#d97706" opacity="0.7"/></svg>`
            ],
            sun: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="48" fill="#e11d48"/><circle cx="50" cy="50" r="42" fill="#facc15"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(0 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(45 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(90 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(135 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(180 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(225 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(270 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(315 50 50)"/></svg>`,
            fireball: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#ff4500"/><circle cx="50" cy="50" r="25" fill="#ffd700"/></svg>`,
            blackhole: `<svg viewBox="0 0 100 100" width="100%" height="100%"><defs><radialGradient id="bhGlow"><stop offset="10%" stop-color="#000"/><stop offset="60%" stop-color="#4c1d95"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><circle cx="50" cy="50" r="50" fill="url(#bhGlow)"/><circle cx="50" cy="50" r="18" fill="#000"/><path d="M50 20 Q65 20 70 50 T50 80 T30 50 Z" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/></svg>`
        };

        // --- ĐIỀU KHIỂN JOYSTICK & KEYBOARD ---
        let joystickActive = false;
        let startX = 0, startY = 0;
        const maxRadius = 30;

        function handleJoystickStart(e) {
            if (isTransitioning) return;
            joystickActive = true;
            knob.style.transition = 'none';
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = joystickZone.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        }

        function handleJoystickMove(e) {
            if (!joystickActive || isTransitioning) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let dx = clientX - startX;
            let dy = clientY - startY;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            playerSpeedX = (dx / maxRadius) * maxSpeed;
            playerSpeedY = (dy / maxRadius) * maxSpeed;
        }

        function handleJoystickEnd() {
            joystickActive = false;
            knob.style.transition = 'transform 0.1s ease-out';
            knob.style.transform = 'translate(0px, 0px)';
            if (!isTransitioning) { playerSpeedX = 0; playerSpeedY = 0; }
        }

        knob.addEventListener('touchstart', handleJoystickStart);
        window.addEventListener('touchmove', handleJoystickMove, { passive: false });
        window.addEventListener('touchend', handleJoystickEnd);
        knob.addEventListener('mousedown', handleJoystickStart);
        window.addEventListener('mousemove', handleJoystickMove);
        window.addEventListener('mouseup', handleJoystickEnd);

        window.addEventListener('keydown', (e) => { if (e.key in keys) { keys[e.key] = true; joystickActive = false; } });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

        function handleKeyboardInput() {
            if (joystickActive || isTransitioning) return;
            let dx = 0, dy = 0;
            if (keys.ArrowUp || keys.w) dy -= 1;
            if (keys.ArrowDown || keys.s) dy += 1;
            if (keys.ArrowLeft || keys.a) dx -= 1;
            if (keys.ArrowRight || keys.d) dx += 1;

            if (dx !== 0 || dy !== 0) {
                let len = Math.sqrt(dx * dx + dy * dy);
                playerSpeedX = (dx / len) * maxSpeed;
                playerSpeedY = (dy / len) * maxSpeed;
                knob.style.transform = `translate(${(dx/len)*maxRadius}px, ${(dy/len)*maxRadius}px)`;
            } else {
                playerSpeedX = 0; playerSpeedY = 0;
                knob.style.transform = 'translate(0px, 0px)';
            }
        }

        // --- CẬP NHẬT CHẶNG ĐIỂM ---
        function updatePhaseUI() {
            if (isTransitioning) return;
            if (score <= 25) {
                phaseText.innerText = "Tầng Nhiệt (Vệ tinh & Trạm vũ trụ)";
                phaseText.style.color = "#38bdf8";
            } else if (score > 25 && score <= 50) {
                phaseText.innerText = "Vành Đai Tiểu Hành Tinh (Thiên thạch lửa)";
                phaseText.style.color = "#ea580c";
            } else if (score > 50 && score <= 75) {
                phaseText.innerText = "Vành Đai Hành Tinh (Hành tinh lớn)";
                phaseText.style.color = "#a855f7";
            } else if (score > 75 && score < 100) {
                phaseText.innerText = "Vành Đai Mặt Trời (BOSS CHIẾN)";
                phaseText.style.color = "#f43f5e";
                if (!sunObject) spawnSunBoss(); 
            } else if (score >= 100) {
                startBlackHoleTransition(); // Đạt 100 điểm kích hoạt sự kiện cốt truyện
            }
        }

        function spawnSunBoss() {
            const sunDiv = document.createElement('div');
            sunDiv.classList.add('obstacle', 'sun-glow');
            sunDiv.innerHTML = VISUAL_ASSETS.sun;
            const size = 180;
            const posX = canvasWidth - 110;
            const posY = (canvasHeight - size) / 2;
            sunDiv.style.width = size + 'px';
            sunDiv.style.height = size + 'px';
            sunDiv.style.left = posX + 'px';
            sunDiv.style.top = posY + 'px';
            canvas.appendChild(sunDiv);
            sunObject = { element: sunDiv, x: posX, y: posY, size: size };
            sunAttackInterval = setInterval(triggerSunAttack, 1600);
        }

        // --- TẤN CÔNG: VÒNG LỬA & CỘT LỬA XUẤT HIỆN TỪ TỪ ---
        function triggerSunAttack() {
            if (isGameOver || score >= 100 || !sunObject) return;
            const attackType = Math.random() > 0.5 ? 'RING' : 'FLARE';

            if (attackType === 'RING') {
                // VÒNG LỬA: Xuất hiện từ từ cạnh Mặt Trời rồi lao đi
                const ring = document.createElement('div');
                ring.classList.add('obstacle', 'glow-effect');
                ring.innerHTML = VISUAL_ASSETS.fireball;
                let rSize = 30;
                let rX = sunObject.x - 20;
                let rY = sunObject.y + (sunObject.size / 2) - 15 + (Math.random() * 80 - 40);
                ring.style.width = rSize + 'px';
                ring.style.height = rSize + 'px';
                ring.style.left = rX + 'px';
                ring.style.top = rY + 'px';
                ring.style.opacity = '0';
                ring.style.transition = 'opacity 0.5s';
                canvas.appendChild(ring);

                setTimeout(() => {
                    ring.style.opacity = '1';
                    obstacles.push({
                        element: ring, x: rX, y: rY,
                        speedX: -(Math.random() * 2 + 4.5), speedY: Math.random() * 2 - 1,
                        size: rSize, isFlame: true
                    });
                }, 400);
            } else {
                // CỘT LỬA XUẤT HIỆN TỪ TỪ CÓ DẤU HIỆU NÉ CHÍNH XÁC
                const beam = document.createElement('div');
                beam.classList.add('solar-flare-beam');
                const beamHeight = 40;
                const beamY = Math.random() * (canvasHeight - beamHeight);
                beam.style.top = beamY + 'px';
                beam.style.height = beamHeight + 'px';
                canvas.appendChild(beam);

                // Bước 1: Hiện vạch mờ báo hiệu (Dấu hiệu né)
                setTimeout(() => {
                    if (isGameOver || score >= 100) { beam.remove(); return; }
                    beam.style.opacity = '0.25';
                    
                    // Bước 2: Rực sáng dần lên (Xuất hiện từ từ)
                    setTimeout(() => {
                        if (isGameOver || score >= 100) { beam.remove(); return; }
                        beam.style.opacity = '1';
                        
                        let beamAttack = { element: beam, x: 0, y: beamY, width: canvasWidth, height: beamHeight, isBeam: true };
                        obstacles.push(beamAttack);

                        // Bước 3: Duy trì vụ nổ và biến mất
                        setTimeout(() => {
                            beam.remove();
                            let idx = obstacles.indexOf(beamAttack);
                            if (idx > -1) obstacles.splice(idx, 1);
                            if (!isGameOver && score < 100) {
                                score += 2;
                                scoreDisplay.innerText = score;
                                updatePhaseUI();
                            }
                        }, 600);
                    }, 800); // Thời gian cột lửa tụ năng lượng sáng dần lên
                }, 50);
            }
        }

        function spawnObstacle() {
            if (isGameOver || score >= 75) return;
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            let size = 30, spX = 0, spY = 0;
            let posX = canvasWidth;
            let posY = Math.random() * (canvasHeight - 65) + 15;

            if (score <= 25) {
                if (Math.random() > 0.6) { obstacle.innerHTML = VISUAL_ASSETS.spaceStation; size = 50; }
                else { obstacle.innerHTML = VISUAL_ASSETS.satellite; size = 35; }
                spX = -(Math.random() * 2 + 3);
            } else if (score > 25 && score <= 50) {
                obstacle.innerHTML = VISUAL_ASSETS.meteor; obstacle.classList.add('glow-effect'); size = 35;
                const edge = Math.floor(Math.random() * 4);
                if (edge === 0) { posX = Math.random() * canvasWidth; posY = -40; spX = Math.random() * 4 - 2; spY = Math.random() * 2 + 3; }
                else if (edge === 1) { posX = Math.random() * canvasWidth; posY = canvasHeight + 10; spX = Math.random() * 4 - 2; spY = -(Math.random() * 2 + 3); }
                else { posX = edge === 2 ? -40 : canvasWidth + 10; posY = Math.random() * canvasHeight; spX = edge === 2 ? (Math.random() * 2 + 3) : -(Math.random() * 2 + 3); spY = Math.random() * 4 - 2; }
            } else if (score > 50 && score <= 75) {
                obstacle.innerHTML = VISUAL_ASSETS.planets[Math.floor(Math.random() * VISUAL_ASSETS.planets.length)];
                size = Math.floor(Math.random() * 20) + 65;
                spX = -(Math.random() * 1.5 + 2);
            }

            obstacle.style.width = size + 'px'; obstacle.style.height = size + 'px';
            obstacle.style.left = posX + 'px'; obstacle.style.top = posY + 'px';
            canvas.appendChild(obstacle);
            obstacles.push({ element: obstacle, x: posX, y: posY, speedX: spX, speedY: spY, size: size });
        }

        // --- SỰ KIỆN CHUYỂN CẢNH: HỐ ĐEN NUỐT CHỬNG VÀO DẢI NGÂN HÀ ---
        function startBlackHoleTransition() {
            isTransitioning = true;
            clearInterval(spawnInterval);
            clearInterval(sunAttackInterval);
            
            // Xóa toàn bộ đạn lửa xung quanh
            obstacles.forEach(obs => obs.element.remove());
            obstacles = [];

            // 1. Xuất hiện dòng chữ "VƯỢT QUA HỆ MẶT TRỜI"
            victoryAnnounce.style.display = 'flex';

            // 2. Thu nhỏ Mặt Trời và làm mờ dần biến mất
            if (sunObject) {
                sunObject.element.style.transition = 'all 2s ease';
                sunObject.element.style.transform = 'scale(0)';
                sunObject.element.style.opacity = '0';
                setTimeout(() => { sunObject.element.remove(); sunObject = null; }, 2000);
            }

            // 3. Sau 2.5 giây, tắt dòng chữ và sinh ra Hố Đen khổng lồ ở giữa màn hình
            setTimeout(() => {
                victoryAnnounce.style.opacity = '0';
                setTimeout(() => victoryAnnounce.style.display = 'none', 500);

                const bhDiv = document.createElement('div');
                bhDiv.classList.add('obstacle', 'blackhole-glow');
                bhDiv.innerHTML = VISUAL_ASSETS.blackhole;
                let bhSize = 150;
                let bhX = (canvasWidth - bhSize) / 2;
                let bhY = (canvasHeight - bhSize) / 2;
                bhDiv.style.width = bhSize + 'px';
                bhDiv.style.height = bhSize + 'px';
                bhDiv.style.left = bhX + 'px';
                bhDiv.style.top = bhY + 'px';
                bhDiv.style.opacity = '0';
                bhDiv.style.transition = 'opacity 1.5s';
                canvas.appendChild(bhDiv);

                blackHoleObject = { element: bhDiv, x: bhX, y: bhY, size: bhSize };
                setTimeout(() => bhDiv.style.opacity = '1', 50);

                // 4. Kích hoạt lực hút của Hố Đen lên tàu vũ trụ
                playerSpeedX = 0; playerSpeedY = 0; 
            }, 2500);
        }

        // --- VÒNG LẶP GAME CHÍNH ---
        function updateGame() {
            if (isGameOver) return;

            if (!isTransitioning) {
                handleKeyboardInput();
                playerX += playerSpeedX;
                playerY += playerSpeedY;
            } else if (blackHoleObject) {
                // Thuật toán tự động hút tàu vũ trụ vào tâm hố đen không thể cưỡng lại
                let pCenterX = playerX + playerSize / 2;
                let pCenterY = playerY + playerSize / 2;
                let bhCenterX = blackHoleObject.x + blackHoleObject.size / 2;
                let bhCenterY = blackHoleObject.y + blackHoleObject.size / 2;

                let dx = bhCenterX - pCenterX;
                let dy = bhCenterY - pCenterY;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 3) {
                    playerX += (dx / dist) * 2.5; // Tàu tự trôi về tâm hố đen
                    playerY += (dy / dist) * 2.5;
                    player.style.transform = `rotate(${Math.atan2(dy, dx) * 180 / Math.PI + 90}deg)`;
                } else {
                    // Khi đã vào sát tâm hố đen -> Thực hiện xoáy và biến mất hẳn
                    blackHoleObject.element.style.transform = 'scale(1.5)';
                    player.style.width = '0px';
                    player.style.height = '0px';
                    player.style.opacity = '0';
                    
                    clearInterval(gameInterval);
                    
                    // Bước 5: Chuyển sang Không gian Dải ngân hà thành công!
                    setTimeout(() => {
                        document.body.style.background = '#090514'; // Thay đổi màu nền vũ trụ sâu thẳm
                        canvas.style.background = 'radial-gradient(circle at center, #1e1b4b 0%, #090514 100%)';
                        canvas.style.borderColor = '#a855f7'; // Đổi khung viền sang màu tím huyền ảo
                        phaseText.innerText = "DẢI NGÂN HÀ (THÀNH CÔNG!)";
                        phaseText.style.color = "#c084fc";
                        
                        setTimeout(() => endGame(true), 1500);
                    }, 800);
                    return;
                }
            }

            if (playerX < 0) playerX = 0;
            if (playerX > canvasWidth - playerSize) playerX = canvasWidth - playerSize;
            if (playerY < 0) playerY = 0;
            if (playerY > canvasHeight - playerSize) playerY = canvasHeight - playerSize;

            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';

            if (sunObject && !isTransitioning) {
                let pCenterX = playerX + playerSize / 2;
                let pCenterY = playerY + playerSize / 2;
                let sCenterX = sunObject.x + sunObject.size / 2;
                let sCenterY = sunObject.y + sunObject.size / 2;
                let distToSun = Math.sqrt((pCenterX - sCenterX) ** 2 + (pCenterY - sCenterY) ** 2);
                if (distToSun < (playerSize / 2 + sunObject.size / 2 - 22)) { endGame(false); return; }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                if (obs.isBeam) {
                    if (playerY + playerSize > obs.y && playerY < obs.y + obs.height) { endGame(false); return; }
                    continue;
                }

                obs.x += obs.speedX; obs.y += obs.speedY;
                obs.element.style.left = obs.x + 'px'; obs.element.style.top = obs.y + 'px';

                let pCenterX = playerX + playerSize / 2;
                let pCenterY = playerY + playerSize / 2;
                let oCenterX = obs.x + obs.size / 2;
                let oCenterY = obs.y + obs.size / 2;
                let distance = Math.sqrt((pCenterX - oCenterX) ** 2 + (pCenterY - oCenterY) ** 2);

                if (distance < (playerSize / 2 + obs.size / 2 - 4)) { endGame(false); return; }

                if (obs.x < -120 || obs.x > canvasWidth + 120 || obs.y < -120 || obs.y > canvasHeight + 120) {
                    obs.element.remove(); obstacles.splice(i, 1);
                    if (!obs.isFlame) { score++; scoreDisplay.innerText = score; updatePhaseUI(); }
                }
            }

            // Tăng điểm tự động khi sinh tồn ở chặng Boss Mặt Trời
            if (score > 75 && score < 100 && !isTransitioning) {
                if (Math.random() < 0.009) { score++; scoreDisplay.innerText = score; updatePhaseUI(); }
            }
        }

        function endGame(isWin) {
            isGameOver = true;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            clearInterval(sunAttackInterval);
            finalScoreDisplay.innerText = score;
            
            if (isWin) {
                winLoseTitle.innerText = "🌌 CHIẾN THẮNG DẢI NGÂN HÀ!";
                winLoseTitle.style.color = "#c084fc";
                winLoseTitle.style.textShadow = "0 0 25px #6366f1";
            } else {
                winLoseTitle.innerText = "TÀU VŨ TRỤ BỊ PHÁ HỦY!";
                winLoseTitle.style.color = "#f43f5e";
                winLoseTitle.style.textShadow = "0 0 15px rgba(244,63,94,0.4)";
            }

            gameOverScreen.style.display = 'flex';
            for (let k in keys) keys[k] = false;
            handleJoystickEnd();
        }

        function startGame() {
            canvasWidth = canvas.clientWidth;
            canvasHeight = canvas.clientHeight;

            document.body.style.background = '#020617';
            canvas.style.background = 'radial-gradient(circle at center, #0f172a 0%, #020617 100%)';
            canvas.style.borderColor = '#38bdf8';

            obstacles.forEach(obs => obs.element.remove());
            obstacles = [];
            
            if (sunObject) { sunObject.element.remove(); sunObject = null; }
            if (blackHoleObject) { blackHoleObject.element.remove(); blackHoleObject = null; }

            player.style.width = '40px';
            player.style.height = '40px';
            player.style.opacity = '1';
            player.style.transform = 'rotate(90deg)';

            score = 0;
            isGameOver = false;
            isTransitioning = false;
            playerX = 50;
            playerY = (canvasHeight - playerSize) / 2;
            
            scoreDisplay.innerText = score;
            victoryAnnounce.style.display = 'none';
            victoryAnnounce.style.opacity = '1';
            gameOverScreen.style.display = 'none';

            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 1000 / 60);

            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnObstacle, 850); 
            
            clearInterval(sunAttackInterval);
            updatePhaseUI();
        }

        window.addEventListener('resize', () => {
            canvasWidth = canvas.clientWidth;
            canvasHeight = canvas.clientHeight;
        });

        startGame();
    </script>
</body>
