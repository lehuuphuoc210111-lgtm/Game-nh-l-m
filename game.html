<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hành Trình Tới Mặt Trời</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            background: #020617;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        #uiContainer {
            width: 95vw;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        #scoreBoard, #phaseBoard {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }
        #phaseBoard { color: #38bdf8; }

        /* Khung chứa game chính */
        #gameCanvas {
            position: relative;
            width: 95vw;
            max-width: 800px;
            height: 420px;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            border: 3px solid #38bdf8;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
        }

        /* Nhân vật: Tàu vũ trụ */
        #player {
            position: absolute;
            width: 45px;
            height: 45px;
            z-index: 10;
            transform: rotate(90deg); /* Định hướng mũi tàu bay về bên phải */
        }

        /* Định dạng chung vật thể chướng ngại vật */
        .obstacle {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Lớp phủ hiệu ứng ánh sáng cho Thiên thạch và Mặt trời */
        .glow-effect {
            filter: drop-shadow(-6px 0px 5px #ef4444) drop-shadow(0px 0px 8px #f97316);
        }

        /* Màn hình kết thúc (Thua / Thắng) */
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        /* --- HỆ THỐNG ĐIỀU KHIỂN JOYSTICK --- */
        #joystickContainer {
            margin-top: 15px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(56, 189, 248, 0.3);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystickKnob {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.05s ease-out;
        }

        button {
            background: #10b981; border: none; padding: 12px 28px;
            color: white; font-size: 16px; font-weight: bold;
            border-radius: 8px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
        button:hover { background: #059669; }
    </style>
</head>
<body>

    <div id="uiContainer">
        <div id="scoreBoard">Điểm: <span id="score">0</span></div>
        <div id="phaseBoard">Vùng hành trình: <span id="phaseText">Tầng Nhiệt</span></div>
    </div>
    
    <div id="gameCanvas">
        <div id="player">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <path d="M42 82 L50 98 L58 82 Z" fill="#ef4444" />
                <path d="M46 82 L50 92 L54 82 Z" fill="#f97316" />
                <path d="M48 70 L50 82 L52 70 Z" fill="#3b82f6" />
                <path d="M30 50 L8 72 L30 72 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />
                <path d="M70 50 L92 72 L70 72 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />
                <path d="M50 5 C72 42, 70 74, 68 78 C62 82, 38 82, 32 78 C30 74, 28 42, 50 5 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
                <path d="M50 5 C61 25, 39 25, 50 5 Z" fill="#dc2626" />
                <circle cx="50" cy="38" r="9" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
                <circle cx="47" cy="35" r="3" fill="#ffffff" opacity="0.7"/>
            </svg>
        </div>
        
        <div id="gameOverScreen">
            <h1 id="winLoseTitle" style="color: #f43f5e; margin: 0; text-shadow: 0 0 15px rgba(244,63,94,0.4);">TÀU VŨ TRỤ BỊ PHÁ HỦY!</h1>
            <p style="font-size: 18px; margin: 10px 0;">Điểm số cuối cùng: <span id="finalScore">0</span></p>
            <button onclick="startGame()">Tái sinh tàu</button>
        </div>
    </div>

    <div id="joystickContainer">
        <div id="joystickKnob"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');
        const phaseText = document.getElementById('phaseText');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const winLoseTitle = document.getElementById('winLoseTitle');
        const knob = document.getElementById('joystickKnob');
        const joystickZone = document.getElementById('joystickContainer');

        let canvasWidth = canvas.clientWidth;
        let canvasHeight = canvas.clientHeight;

        let playerX, playerY;
        const playerSize = 45;
        let playerSpeedX = 0, playerSpeedY = 0;
        const maxSpeed = 6.5; 

        let score = 0;
        let isGameOver = false;
        let gameInterval, spawnInterval;
        let obstacles = [];

        const keys = { w: false, s: false, a: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        // --- KHO DỮ LIỆU ĐỒ HỌA VECTOR TRỰC QUAN (MÔ PHỎNG THEO HÌNH ẢNH CỦA BẠN) ---
        const VISUAL_ASSETS = {
            // Hình 2: Vệ tinh & Trạm vũ trụ
            satellite: `<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="42" y="15" width="16" height="70" rx="4" fill="#94a3b8" stroke="#475569"/><rect x="5" y="32" width="32" height="16" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/><rect x="63" y="32" width="32" height="16" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/><circle cx="50" cy="40" r="10" fill="#cbd5e1"/><circle cx="50" cy="65" r="7" fill="#64748b"/></svg>`,
            spaceStation: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="24" fill="none" stroke="#94a3b8" stroke-width="5"/><rect x="10" y="44" width="80" height="12" fill="#475569" rx="2"/><rect x="44" y="10" width="12" height="80" fill="#475569" rx="2"/><rect x="2" y="20" width="14" height="60" fill="#38bdf8" stroke="#0284c7"/><rect x="84" y="20" width="14" height="60" fill="#38bdf8" stroke="#0284c7"/><circle cx="50" cy="50" r="14" fill="#e2e8f0" stroke="#475569"/></svg>`,
            // Hình 1: Thiên thạch lửa bốc cháy dữ dội
            meteor: `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M-15 50 Q15 -5 65 20 T100 55 T50 95 Z" fill="#ea580c"/><path d="M10 50 Q30 15 65 30 T85 60 T50 82 Z" fill="#78350f"/><path d="M-40 45 L15 25 L5 55 Z" fill="#f97316"/><path d="M-30 55 L10 42 L0 65 Z" fill="#ef4444"/><circle cx="45" cy="42" r="6" fill="#451a03"/><circle cx="68" cy="60" r="8" fill="#451a03"/></svg>`,
            // Hình 3: Các hành tinh hệ mặt trời loại trừ Trái Đất
            planets: [
                `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#dc2626"/><circle cx="32" cy="35" r="10" fill="#991b1b" opacity="0.5"/><circle cx="65" cy="62" r="7" fill="#991b1b" opacity="0.6"/></svg>`, // Sao Hỏa (Mars)
                `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#f59e0b"/><rect x="6" y="25" width="88" height="12" fill="#b45309" opacity="0.6"/><rect x="5" y="52" width="90" height="16" fill="#d97706" opacity="0.7"/><circle cx="70" cy="60" r="9" fill="#ea580c"/></svg>`, // Sao Mộc (Jupiter)
                `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="49" ry="14" fill="none" stroke="#cbd5e1" stroke-width="6" transform="rotate(-15 50 50)"/><circle cx="50" cy="50" r="32" fill="#fef08a"/><ellipse cx="50" cy="50" rx="49" ry="14" fill="none" stroke="#e2e8f0" stroke-width="3" transform="rotate(-15 50 50)"/></svg>` // Sao Thổ (Saturn)
            ],
            // Điểm kết thúc: Mặt Trời siêu khổng lồ rực lửa
            sun: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="42" fill="#e11d48"/><circle cx="50" cy="50" r="38" fill="#facc15"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(0 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(45 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(90 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(135 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(180 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(225 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(270 50 50)"/><path d="M50 0 L56 18 L44 18 Z" fill="#ea580c" transform="rotate(315 50 50)"/></svg>`
        };

        // --- ĐIỀU KHIỂN ĐỒNG BỘ SONG SONG (JOYSTICK & KEYBOARD) ---
        let joystickActive = false;
        let startX = 0, startY = 0;
        const maxRadius = 40;

        function handleJoystickStart(e) {
            joystickActive = true;
            knob.style.transition = 'none';
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = joystickZone.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        }

        function handleJoystickMove(e) {
            if (!joystickActive) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let dx = clientX - startX;
            let dy = clientY - startY;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (clientY - startY) / dist * maxRadius;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            playerSpeedX = (dx / maxRadius) * maxSpeed;
            playerSpeedY = (dy / maxRadius) * maxSpeed;
        }

        function handleJoystickEnd() {
            if (!joystickActive) return;
            joystickActive = false;
            knob.style.transition = 'transform 0.1s ease-out';
            knob.style.transform = 'translate(0px, 0px)';
            playerSpeedX = 0; playerSpeedY = 0;
        }

        knob.addEventListener('touchstart', handleJoystickStart);
        window.addEventListener('touchmove', handleJoystickMove, { passive: false });
        window.addEventListener('touchend', handleJoystickEnd);
        knob.addEventListener('mousedown', handleJoystickStart);
        window.addEventListener('mousemove', handleJoystickMove);
        window.addEventListener('mouseup', handleJoystickEnd);

        window.addEventListener('keydown', (e) => { if (e.key in keys) { keys[e.key] = true; joystickActive = false; } });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

        function handleKeyboardInput() {
            if (joystickActive) return;
            let dx = 0, dy = 0;
            if (keys.ArrowUp || keys.w) dy -= 1;
            if (keys.ArrowDown || keys.s) dy += 1;
            if (keys.ArrowLeft || keys.a) dx -= 1;
            if (keys.ArrowRight || keys.d) dx += 1;

            if (dx !== 0 || dy !== 0) {
                let len = Math.sqrt(dx * dx + dy * dy);
                let nx = dx / len; let ny = dy / len;
                playerSpeedX = nx * maxSpeed;
                playerSpeedY = ny * maxSpeed;
                knob.style.transform = `translate(${nx * maxRadius}px, ${ny * maxRadius}px)`;
            } else {
                playerSpeedX = 0; playerSpeedY = 0;
                knob.style.transform = 'translate(0px, 0px)';
            }
        }

        // --- CẬP NHẬT GIAI ĐOẠN ĐIỂM SỐ CHUẨN ---
        function updatePhaseUI() {
            if (score <= 50) {
                phaseText.innerText = "Tầng Nhiệt (Vệ tinh & Trạm vũ trụ)";
                phaseText.style.color = "#38bdf8";
            } else if (score > 50 && score <= 75) {
                phaseText.innerText = "Vành Đai Tiểu Hành Tinh (Thiên thạch lửa)";
                phaseText.style.color = "#ea580c";
            } else if (score > 75 && score < 100) {
                phaseText.innerText = "Vành Đai Hành Tinh (Hành tinh khổng lồ)";
                phaseText.style.color = "#a855f7";
            } else if (score >= 100) {
                endGame(true); // Đạt mốc 100 điểm cuối cùng -> Chiến thắng hoàn toàn!
            }
        }

        // --- KHỞI TẠO VẬT THỂ LIÊN TỤC THEO QUY ĐỊNH ---
        function spawnObstacle() {
            if (isGameOver || score >= 100) return;

            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            
            let size = 30;
            let spX = 0, spY = 0;
            let posX = canvasWidth;
            let posY = Math.random() * (canvasHeight - 65) + 15;

            // GIAI ĐOẠN 1: TẦNG NHIỆT (Vệ tinh và Trạm vũ trụ bay ngang) [Hình số 2]
            if (score <= 50) {
                const isStation = Math.random() > 0.6;
                if (isStation) {
                    obstacle.innerHTML = VISUAL_ASSETS.spaceStation;
                    size = 55;
                } else {
                    obstacle.innerHTML = VISUAL_ASSETS.satellite;
                    size = 38;
                }
                spX = -(Math.random() * 2 + 3.5);
                spY = 0;
            } 
            // GIAI ĐOẠN 2: VÀNH ĐAI TIỂU HÀNH TINH (Thiên thạch lửa phóng đa hướng) [Hình số 1]
            else if (score > 50 && score <= 75) {
                obstacle.innerHTML = VISUAL_ASSETS.meteor;
                obstacle.classList.add('glow-effect');
                size = 38;

                const edge = Math.floor(Math.random() * 4);
                if (edge === 0) { // Từ cạnh trên lao xuống
                    posX = Math.random() * canvasWidth; posY = -40;
                    spX = Math.random() * 4 - 2; spY = Math.random() * 3 + 4;
                } else if (edge === 1) { // Từ cạnh dưới lao lên
                    posX = Math.random() * canvasWidth; posY = canvasHeight + 10;
                    spX = Math.random() * 4 - 2; spY = -(Math.random() * 3 + 4);
                } else { // Từ hai biên hông lao sang
                    posX = edge === 2 ? -40 : canvasWidth + 10;
                    posY = Math.random() * canvasHeight;
                    spX = edge === 2 ? (Math.random() * 3 + 4) : -(Math.random() * 3 + 4);
                    spY = Math.random() * 4 - 2;
                }
            } 
            // GIAI ĐOẠN 3: VÀNH ĐAI HÀNH TINH & ĐÍCH ĐẾN MẶT TRỜI [Hình cuối cùng]
            else if (score > 75 && score < 100) {
                // Nếu điểm gần chạm đích (từ 96đ trở đi) và chưa có Mặt Trời, sinh ra Mặt Trời ở vạch đích
                if (score >= 96 && !obstacles.some(o => o.isSun)) {
                    obstacle.innerHTML = VISUAL_ASSETS.sun;
                    obstacle.classList.add('glow-effect');
                    size = 140; // Kích thước khổng lồ của ngôi sao trung tâm
                    posX = canvasWidth + 60;
                    posY = (canvasHeight - size) / 2; // Căn giữa bản đồ
                    spX = -1.2; // Di chuyển rất chậm rãi như một cột mốc cán đích
                    obstacle.isSun = true;
                } else {
                    // Sinh các hành tinh khổng lồ ngẫu nhiên ngẫu nhiên (Hỏa, Mộc, Thổ - Không có Trái Đất)
                    const randomPlanet = VISUAL_ASSETS.planets[Math.floor(Math.random() * VISUAL_ASSETS.planets.length)];
                    obstacle.innerHTML = randomPlanet;
                    size = Math.floor(Math.random() * 25) + 75; // To hẳn từ 75px đến 100px
                    posX = canvasWidth + 30;
                    posY = Math.random() * (canvasHeight - size);
                    spX = -(Math.random() * 1.5 + 2);
                }
                spY = 0;
            }

            obstacle.style.width = size + 'px';
            obstacle.style.height = size + 'px';
            obstacle.style.left = posX + 'px';
            obstacle.style.top = posY + 'px';
            canvas.appendChild(obstacle);

            obstacles.push({
                element: obstacle, x: posX, y: posY,
                speedX: spX, speedY: spY, size: size, isSun: obstacle.isSun || false
            });
        }

        // --- VÒNG LẶP KIỂM TRA VA CHẠM VÀ DI CHUYỂN TOÀN CỤC ---
        function updateGame() {
            if (isGameOver) return;

            handleKeyboardInput();

            playerX += playerSpeedX;
            playerY += playerSpeedY;

            if (playerX < 0) playerX = 0;
            if (playerX > canvasWidth - playerSize) playerX = canvasWidth - playerSize;
            if (playerY < 0) playerY = 0;
            if (playerY > canvasHeight - playerSize) playerY = canvasHeight - playerSize;

            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x += obs.speedX;
                obs.y += obs.speedY;
                obs.element.style.left = obs.x + 'px';
                obs.element.style.top = obs.y + 'px';

                // Kiểm tra va chạm theo thuật toán bán kính hình tròn (Chính xác tuyệt đối với hành tinh tròn)
                let pCenterX = playerX + playerSize / 2;
                let pCenterY = playerY + playerSize / 2;
                let oCenterX = obs.x + obs.size / 2;
                let oCenterY = obs.y + obs.size / 2;
                let distance = Math.sqrt((pCenterX - oCenterX) ** 2 + (pCenterY - oCenterY) ** 2);

                if (distance < (playerSize / 2 + obs.size / 2 - 5)) {
                    if (obs.isSun) {
                        endGame(true); // Lao vào Mặt Trời thành công ở điểm cuối -> Thắng!
                    } else {
                        endGame(false); // Va vào hành tinh/thiên thạch khác -> Thua
                    }
                    return;
                }

                // Nhận điểm khi vật thể bay ra ngoài rìa bản đồ hoàn toàn
                if (obs.x < -160 || obs.x > canvasWidth + 160 || obs.y < -160 || obs.y > canvasHeight + 160) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                    score++;
                    scoreDisplay.innerText = score;
                    updatePhaseUI();
                }
            }
        }

        function endGame(isWin) {
            isGameOver = true;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            finalScoreDisplay.innerText = score;
            
            if (isWin) {
                winLoseTitle.innerText = "☀️ CHIẾN THẮNG HÀNH TRÌNH!";
                winLoseTitle.style.color = "#facc15";
                winLoseTitle.style.textShadow = "0 0 25px #e11d48";
            } else {
                winLoseTitle.innerText = "TÀU VŨ TRỤ BỊ PHÁ HỦY!";
                winLoseTitle.style.color = "#f43f5e";
                winLoseTitle.style.textShadow = "0 0 15px rgba(244,63,94,0.4)";
            }

            gameOverScreen.style.display = 'flex';
            for (let k in keys) keys[k] = false;
            handleJoystickEnd();
        }

        function startGame() {
            canvasWidth = canvas.clientWidth;
            canvasHeight = canvas.clientHeight;

            obstacles.forEach(obs => obs.element.remove());
            obstacles = [];

            score = 0;
            isGameOver = false;
            playerX = 60;
            playerY = (canvasHeight - playerSize) / 2;
            
            scoreDisplay.innerText = score;
            updatePhaseUI();
            gameOverScreen.style.display = 'none';

            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 1000 / 60);

            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnObstacle, 750); 
        }

        startGame();
    </script>
</body>
</html>
