<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Triệu Phú - Phiên Bản Cao Cấp</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #091136 0%, #030616 100%);
            --panel-bg: rgba(11, 21, 62, 0.85);
            --neon-blue: #00f3ff;
            --neon-gold: #ffd700;
            --text-color: #ffffff;
            --border-glow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
        
        body { 
            background: var(--bg-gradient); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
        }

        .main-frame {
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            box-shadow: var(--border-glow);
            width: 100%;
            max-width: 1100px;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .game-zone {
            flex: 3;
            padding: 30px;
            border-right: 2px solid rgba(0, 243, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-zone {
            flex: 1;
            background: rgba(5, 10, 35, 0.9);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* KHU VỰC TRỢ GIÚP */
        .help-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }

        .help-box-wrapper {
            position: relative;
            width: 85px;
            height: 55px;
        }

        .help-btn {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #121a4e 0%, #060b24 100%);
            border: 2px solid #3a539b;
            color: #ffffff;
            border-radius: 50% / 50%;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .help-btn .icon {
            font-size: 16px;
        }

        .help-btn:hover:not(.used) {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            transform: scale(1.05);
        }

        .help-box-wrapper.used::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(to top right, transparent 45%, #ff2222 48%, #ff2222 52%, transparent 55%),
                linear-gradient(to top left, transparent 45%, #ff2222 48%, #ff2222 52%, transparent 55%);
            border-radius: 50% / 50%;
            pointer-events: none;
        }
        .help-box-wrapper.used .help-btn {
            border-color: #444 !important;
            color: #666 !important;
            background: #111 !important;
            cursor: not-allowed;
        }

        /* ĐỒNG HỒ THỜI GIAN */
        .timer-container {
            background: rgba(4, 8, 28, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 12px 20px;
            border-radius: 10px;
            margin-top: 5px;
        }

        .timer-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .time-text { color: #ff3333; font-size: 16px; }

        .progress-line {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            transition: width 0.1s linear;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--neon-gold);
            font-weight: bold;
            font-size: 16px;
            padding: 0 5px;
            margin-top: 10px;
        }

        /* KHU VỰC CÂU HỎI */
        .question-container {
            background: rgba(9, 19, 58, 0.95);
            border: 2px solid rgba(0, 243, 255, 0.6);
            border-radius: 40px;
            padding: 30px 25px;
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.2);
            line-height: 1.4;
        }

        /* LƯỚI ĐÁP ÁN */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .answer-card {
            background: rgba(9, 19, 58, 0.7);
            border: 2px solid rgba(0, 243, 255, 0.4);
            border-radius: 30px;
            padding: 16px 25px;
            text-align: left;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .answer-card:hover:not(.disabled) {
            border-color: var(--neon-gold);
            background: rgba(24, 43, 114, 0.6);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .prefix {
            color: var(--neon-gold);
            margin-right: 12px;
            font-weight: bold;
        }

        .answer-card.selected { background: #ff9100 !important; border-color: #ffffff !important; color: #000000 !important; }
        .answer-card.correct { background: #2e7d32 !important; border-color: #a1ffb2 !important; color: white !important; }
        .answer-card.wrong { background: #c62828 !important; border-color: #ff9e9e !important; color: white !important; }
        .answer-card.disabled { cursor: not-allowed; opacity: 0.6; }

        /* THÁP TIỀN THƯỞNG */
        .money-ladder {
            display: flex;
            flex-direction: column-reverse;
            gap: 3px;
        }

        .ladder-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 15px;
            font-size: 13px;
            font-weight: bold;
            color: #6175aa;
            border-radius: 4px;
        }

        .ladder-item.active {
            background: linear-gradient(90deg, #ff8f00, #e65100);
            color: #ffffff !important;
            box-shadow: 0 0 8px #ff8f00;
        }

        .ladder-item.milestone { color: var(--neon-gold); }

        /* KHUNG HIỂN THỊ TRỢ GIÚP TRỰC TIẾP */
        .live-help-panel {
            display: none;
            background: rgba(6, 12, 42, 0.95);
            border: 2px solid var(--neon-gold);
            border-radius: 15px;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            margin-top: 5px;
            animation: slideDown 0.3s ease;
        }

        .live-help-title { color: var(--neon-gold); font-weight: bold; font-size: 15px; margin-bottom: 5px; text-transform: uppercase; }
        .live-help-content { font-size: 15px; color: #e2e8f0; font-style: italic; }

        /* BIỂU ĐỒ KHÁN GIẢ */
        .chart-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            height: 80px;
            margin-top: 10px;
        }
        .chart-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40px;
            font-size: 12px;
            color: #ffffff;
        }
        .chart-bar {
            width: 100%;
            background: linear-gradient(to top, #0088cc, #00f3ff);
            border-radius: 4px 4px 0 0;
            transition: height 0.6s ease-out;
            margin-bottom: 4px;
        }

        /* POPUP MODAL CHÍNH */
        .modal-overlay {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 15, 0.93);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            background: #0b153e;
            border: 3px solid var(--neon-gold);
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .modal-box h2 { font-size: 28px; color: var(--neon-gold); margin-bottom: 15px; }
        .modal-box p { font-size: 16px; margin-bottom: 25px; color: #cbd5e1; line-height: 1.5; }
        
        .action-btn {
            background: linear-gradient(90deg, #ff8f00, #ffb300);
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            color: #000000;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-btn:hover { transform: scale(1.05); }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-frame">
        <div class="game-zone">
            <div class="help-container">
                <div class="help-box-wrapper" id="wrap-5050">
                    <button class="help-btn" onclick="use5050()">
                        <span class="icon">⚖️</span>
                        <span>50 / 50</span>
                    </button>
                </div>
                <div class="help-box-wrapper" id="wrap-call">
                    <button class="help-btn" onclick="useCall()">
                        <span class="icon">📞</span>
                        <span>Người Thân</span>
                    </button>
                </div>
                <div class="help-box-wrapper" id="wrap-audience">
                    <button class="help-btn" onclick="useAudience()">
                        <span class="icon">📊</span>
                        <span>Khán Giả</span>
                    </button>
                </div>
                <div class="help-box-wrapper" id="wrap-expert">
                    <button class="help-btn" onclick="useExpert()">
                        <span class="icon">🎓</span>
                        <span>Chuyên Gia</span>
                    </button>
                </div>
                <div class="help-box-wrapper" style="width: auto; height: 55px;">
                    <button class="help-btn" style="border-color: #c62828; color: #ff8a8a; border-radius: 20px; padding: 0 15px;" onclick="stopGame()">
                        <span class="icon" style="margin-bottom: 2px;">🏳️</span>
                        <span>Dừng chơi</span>
                    </button>
                </div>
            </div>

            <div class="timer-container">
                <div class="timer-info">
                    <span>Thời gian: <span class="time-text" id="timer-countdown">30</span> giây</span>
                </div>
                <div class="progress-line">
                    <div class="progress-fill" id="timer-bar"></div>
                </div>
            </div>

            <div class="status-bar">
                <span id="stage-text">Chặng 1: Khởi động</span>
                <span id="prize-text">200.000 VNĐ</span>
            </div>

            <div class="live-help-panel" id="live-help-box">
                <div class="live-help-title" id="live-help-title">Hỗ trợ</div>
                <div class="live-help-content" id="live-help-content">Nội dung...</div>
            </div>

            <div class="question-container" id="question-display">
                Đang tải câu hỏi...
            </div>

            <div class="answers-grid">
                <div class="answer-card" id="btn-0" onclick="selectAnswer(0)"><span class="prefix">A.</span><span id="text-0"></span></div>
                <div class="answer-card" id="btn-1" onclick="selectAnswer(1)"><span class="prefix">B.</span><span id="text-1"></span></div>
                <div class="answer-card" id="btn-2" onclick="selectAnswer(2)"><span class="prefix">C.</span><span id="text-2"></span></div>
                <div class="answer-card" id="btn-3" onclick="selectAnswer(3)"><span class="prefix">D.</span><span id="text-3"></span></div>
            </div>
        </div>

        <div class="sidebar-zone">
            <div class="money-ladder" id="money-ladder-ui"></div>
        </div>
    </div>

    <div id="game-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modal-title">AI LÀ TRIỆU PHÚ</h2>
            <p id="modal-desc">Sẵn sàng trải nghiệm phiên bản nâng cấp có đồng hồ 30 giây và hệ thống trợ giúp trực quan mới?</p>
            <button class="action-btn" onclick="initGame()" id="modal-btn">BẮT ĐẦU CHƠI</button>
        </div>
    </div>

    <script>
        // NGÂN HÀNG CÂU HỎI GỐC (ĐÃ ĐƯỢC XÁO TRỘN ĐÁP ÁN VÀ CẬP NHẬT CHỈ SỐ 'c' CHUẨN XÁC)
        const questionBank = {
            easy: [
                { id: "e1", q: "Ngày 1 tháng 4 dương lịch hàng năm được gọi là ngày gì trong văn hóa phương Tây và quốc tế?", a: ["Ngày lễ Giáng sinh", "Ngày lễ Tình nhân", "Ngày Cá tháng Tư (Ngày nói dối)", "Ngày Halloween"], c: 2 },
                { id: "e2", q: "Điền từ còn thiếu vào câu thành ngữ sau: \"Đi guốc trong...\"?", a: ["Bụng", "Tai", "Đầu", "Miệng"], c: 0 },
                { id: "e3", q: "Bộ phim hoạt hình kinh điển \"Tom và Jerry\" là cuộc rượt đuổi không hồi kết giữa hai con vật nào?", a: ["Chó và Mèo", "Mèo và Chuột", "Sói và Thỏ", "Gấu và Ong"], c: 1 },
                { id: "e4", q: "Thành từ nào còn thiếu trong câu thành ngữ: \"Chữ như gà...\"?", a: ["Cào", "Bới", "Đạp", "Mổ"], c: 1 },
                { id: "e5", q: "Trong trò chơi cờ Vua, quân cờ nào duy nhất có thể đi chéo và chỉ được di chuyển trên các ô cùng màu suốt cả ván đấu?", a: ["Quân Mã", "Quân Xe", "Quân Hậu", "Quân Tượng"], c: 3 },
                { id: "e6", q: "Bộ truyện tranh nổi tiếng \"Thám tử lừng danh Conan\" có nguồn gốc từ quốc gia nào?", a: ["Hàn Quốc", "Nhật Bản", "Trung Quốc", "Mỹ"], c: 1 },
                { id: "e7", q: "Từ nào còn thiếu trong câu thành ngữ: \"Vắt cổ... ra nước\"?", a: ["Chày", "Cối", "Kim", "Chén"], c: 0 },
                { id: "e8", q: "Theo Luật Giao thông đường bộ Việt Nam, người điều khiển xe gắn máy bắt buộc phải đội loại mũ bảo hiểm nào khi tham gia giao thông?", a: ["Mũ bảo hộ lao động", "Mũ rộng vành chống nắng", "Mũ bảo hiểm đạt chuẩn cho người đi mô tô, xe máy", "Mũ lưỡi trai có lót cứng"], c: 2 },
                { id: "e9", q: "Loại quả nào sau đây là nguyên liệu chính không thể thiếu của món \"Sinh tố bơ\" béo ngậy?", a: ["Quả xoài", "Quả sầu riêng", "Quả bơ", "Quả mít"], c: 2 },
                { id: "e10", q: "Trong truyện cổ tích \"Cây tre trăm đốt\", câu thần chú nào được nhân vật Khoai sử dụng để gắn các đốt tre lại với nhau?", a: ["Khắc nhập, khắc nhập", "Khắc xuất, khắc xuất", "Vừng ơi mở ra", "Úm ba la xì bùa"], c: 0 },
                { id: "e11", q: "Ứng dụng nhắn tin, gọi điện miễn phí cực kỳ phổ biến do người Việt phát triển và sở hữu hiện nay là ứng dụng nào?", a: ["Viber", "Zalo", "WhatsApp", "Telegram"], c: 1 },
                { id: "e12", q: "Tết Đoan Ngọ (mùng 5 tháng 5 Âm lịch) trong văn hóa dân gian Việt Nam còn được gọi bằng cái tên phổ biến nào khác?", a: ["Tết Giết sâu bọ", "Tết Khai hạ", "Tết Trung nguyên", "Tết Hạ nguyên"], c: 0 },
                { id: "e13", q: "Điền từ còn thiếu vào câu thành ngữ sau: \"Ếch ngồi đáy...\"?", a: ["Ao", "Chum", "Giếng", "Hồ"], c: 2 },
                { id: "e14", q: "Ngày Báo chí Cách mạng Việt Nam được kỷ niệm hàng năm vào ngày nào trong tháng 6?", a: ["Ngày 1 tháng 6", "Ngày 21 tháng 6", "Ngày 5 tháng 6", "Ngày 28 tháng 6"], c: 1 },
                { id: "e15", q: "Tập truyện dài nổi tiếng dành cho thiếu nhi \"Kính vạn hoa\" của nhà văn Nguyễn Nhật Ánh xoay quanh bộ ba nhân vật học trò nào?", a: ["Quý ròm, Tiểu Long, Hạnh", "Tuấn, Dũng, Thục Hiền", "Mận, Thiều, Tường", "An, Cò, Xinh"], c: 0 },
                { id: "e16", q: "Loại quả nào là nguyên liệu chính để làm nên món chè vải hạt sen ngọt mát của mùa hè miền Bắc?", a: ["Quả nhãn", "Quả chôm chôm", "Quả vải", "Quả mận"], c: 2 },
                { id: "e17", q: "Điền từ còn thiếu vào câu thành ngữ sau: \"Lửa gần rơm lâu ngày cũng...\"?", a: ["Bốc", "Cháy", "Tắt", "Nóng"], c: 1 },
                { id: "e18", q: "Trái cây nào sau đây thường có một hạt lớn ở giữa, thịt quả màu vàng, khi chín có mùi thơm rất đặc trưng và được mệnh danh là \"vua trái cây nhiệt đới\"?", a: ["Sầu riêng", "Măng cụt", "Chôm chôm", "Thanh long"], c: 0 },
                { id: "e19", q: "Ngày Thương binh - Liệt sĩ Việt Nam được kỷ niệm hàng năm vào ngày nào để tri ân các anh hùng liệt sĩ?", a: ["Ngày 1 tháng 5", "Ngày 27 tháng 7", "Ngày 19 tháng 8", "Ngày 22 tháng 12"], c: 1 },
                { id: "e20", q: "Trong môn thể thao bơi lội, kiểu bơi nào mà người bơi nằm ngửa và phối hợp động tác tay quạt luân phiên kết hợp đạp chân?", a: ["Bơi ếch", "Bơi ngửa", "Bơi bướm", "Bơi sải"], c: 1 },
                { id: "e21", q: "Địa danh nào sau đây nổi tiếng với tên gọi \"Thành phố sương mù\" của Việt Nam, một điểm du lịch tránh nóng lý tưởng?", a: ["Vũng Tàu", "Nha Trang", "Đà Lạt", "Phan Thiết"], c: 2 },
                { id: "e22", q: "Điền từ còn thiếu vào câu thành ngữ sau: \"Cá không ăn muối cá...\"?", a: ["Ươn", "Thối", "Hỏng", "Chết"], c: 0 },
                { id: "e23", q: "Ngày Cách mạng tháng Tám thành công của Việt Nam được kỷ niệm hàng năm vào ngày nào?", a: ["Ngày 2 tháng 9", "Ngày 27 tháng 7", "Ngày 19 tháng 8", "Ngày 30 tháng 4"], c: 2 },
                { id: "e24", q: "Loại nhạc cụ nào sau đây thường có cấu tạo gồm các phím tre hoặc gỗ xếp theo thứ tự từ lớn đến nhỏ và dùng hai dùi để gõ?", a: ["Đàn T'rưng", "Đàn Bầu", "Đàn Tranh", "Đàn Đáy"], c: 0 },
                { id: "e25", q: "Từ nào còn thiếu trong câu thành ngữ: \"Lá lành đùm lá...\"?", a: ["Héo", "Úa", "Rách", "Sâu"], c: 2 },
                { id: "e26", q: "Ngày Quốc khánh nước Cộng hòa Xã hội Chủ nghĩa Việt Nam được kỷ niệm hàng năm vào ngày nào?", a: ["Ngày 19 tháng 8", "Ngày 2 tháng 9", "Ngày 10 tháng 10", "Ngày 30 tháng 4"], c: 1 },
                { id: "e27", q: "Loại đèn truyền thống nào thường được trẻ em Việt Nam rước xách nhiều nhất trong đêm hội trăng rằm Trung thu?", a: ["Đèn kéo quân", "Đèn ông sao", "Đèn hoa đăng", "Đèn lồng giấy xếp"], c: 1 },
                { id: "e28", q: "Trên bàn cờ Tướng tiêu chuẩn, quân cờ nào chỉ được phép di chuyển trong cung (9 ô) và không được đi qua sông?", a: ["Quân Xe", "Quân Pháo", "Quân Sĩ", "Quân Mã"], c: 2 },
                { id: "e29", q: "Đâu là tên một loại bánh trung thu truyền thống có vỏ ngoài nướng chín vàng nâu, bên trong thường là nhân thập cẩm hoặc đậu xanh?", a: ["Bánh nướng", "Bánh dẻo", "Bánh pía", "Bánh in"], c: 0 },
                { id: "e30", q: "Từ nào còn thiếu trong câu thành ngữ: \"Chị ngã em...\"?", a: ["Đỡ", "Nâng", "Dìu", "Cười"], c: 1 },

                { id: "m59", q: "Loại nhạc cụ truyền thống nào của Việt Nam chỉ có duy nhất một dây nhưng có thể phát ra âm thanh trầm bổng đặc trưng?", a: ["Đàn bầu", "Đàn nguyệt", "Đàn tì bà", "Đàn tranh"], c: 0 },

                { id: "m62", q: "Vị vua cuối cùng của triều đại phong kiến Việt Nam, người đã thoái vị vào tháng 8 năm 1945 là ai?", a: ["Bảo Đại", "Khai Định", "Duy Tân", "Hàm Nghi"], c: 0 },
                { id: "m63", q: "Quốc gia nào ở khu vực Đông Nam Á hoàn toàn nằm trong nội địa và không giáp với bất kỳ vùng biển nào?", a: ["Lào", "Campuchia", "Myanmar", "Thái Lan"], c: 0 },
                { id: "m64", q: "Trong hệ tuần hoàn, loại mạch máu nào có nhiệm vụ dẫn máu giàu oxy đi từ tim đến nuôi khắp các cơ quan?", a: ["Động mạch", "Tĩnh mạch", "Mao mạch", "Huyết quản"], c: 0 },
                { id: "m65", q: "Eo biển nào nối liền giữa Biển Đông và biển Java, nằm giữa hai đảo lớn Sumatra và Java của Indonesia?", a: ["Eo biển Sunda", "Eo biển Malacca", "Eo biển Bering", "Eo biển Magellan"], c: 0 },

                { id: "m69", q: "Tỉnh nào ở vùng Đông Nam Bộ nước ta nổi tiếng với hồ thủy nhân tạo Trị An và thánh địa của bưởi Tân Triều?", a: ["Đồng Nai", "Bình Dương", "Bà Rịa - Vũng Tàu", "Tây Ninh"], c: 0 },

                { id: "m71", q: "Vịnh biển nào của Việt Nam hai lần được UNESCO công nhận là Di sản thiên nhiên thế giới nhờ giá trị cảnh quan và địa chất?", a: ["Vịnh Hạ Long", "Vịnh Lăng Cô", "Vịnh Nha Trang", "Vịnh Xuân Đài"], c: 0 },
                { id: "m72", q: "Chất khí nào chiếm tỉ lệ thể tích lớn thứ hai trong bầu khí quyển Trái Đất (sau khí Nitơ) với khoảng 21%?", a: ["Khí Oxy", "Khí Argon", "Khí Cacbonic", "Khí Helium"], c: 0 },
                { id: "m73", q: "Truyện ngụ ngôn nổi tiếng 'Thầy bói xem voi' phê phán sai lầm nào của con người trong nhận thức thực tế?", a: ["Phiến diện, nhìn nhận một góc rồi đánh giá toàn thể", "Lười biếng, không chịu tìm tòi học hỏi", "Kiêu ngạo, xem thường ý kiến người khác", "Nhút nhát, không dám nói lên sự thật"], c: 0 }

            hard: [

        const milestones = ["200.000", "400.000", "600.000", "1.000.000", "2.000.000", "3.000.000", "6.000.000", "10.000.000", "14.000.000", "22.000.000", "30.000.000", "40.000.000", "60.000.000", "85.000.000", "150.000.000"];
        let currentLevel = 1;
        let currentQuestion = null;
        let timerInterval = null;
        let timeLeft = 30;
        let usedQuestions = []; // Tránh trùng lặp câu hỏi vừa chơi

        // Khởi tạo tháp tiền bên sidebar hữu ngạn
        function buildMoneyLadder() {
            const ladder = document.getElementById('money-ladder-ui');
            ladder.innerHTML = '';
            milestones.forEach((amount, index) => {
                const step = index + 1;
                const div = document.createElement('div');
                div.id = `ladder-item-${step}`;
                div.className = 'ladder-item';
                if (step === 5 || step === 10 || step === 15) {
                    div.classList.add('milestone');
                }
                div.innerHTML = `<span>${step}</span> <span>${amount}</span>`;
                ladder.appendChild(div);
            });
        }

        function initGame() {
            document.getElementById('game-modal').style.display = 'none';
            buildMoneyLadder();
            currentLevel = 1;
            usedQuestions = [];
            // Reset các nút trợ giúp trực quan
            ['wrap-5050', 'wrap-call', 'wrap-audience', 'wrap-expert'].forEach(id => {
                document.getElementById(id).classList.remove('used');
                document.getElementById(id).querySelector('button').disabled = false;
            });
            loadQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showEndModal("HẾT GIỜ!", `Thời gian suy nghĩ đã hết. Bạn dừng cuộc chơi tại câu số ${currentLevel} với mốc tiền thưởng tương ứng.`);
                }
            }, 1000);
        }

        function updateTimerUI() {
            document.getElementById('timer-countdown').innerText = timeLeft;
            const percentage = (timeLeft / 30) * 100;
            document.getElementById('timer-bar').style.width = `${percentage}%`;
        }

        function loadQuestion() {
            hideHelpPanel();
            resetAnswerCards();

            // Cập nhật Highlight tháp tiền thưởng
            document.querySelectorAll('.ladder-item').forEach(el => el.classList.remove('active'));
            const currentItem = document.getElementById(`ladder-item-${currentLevel}`);
            if (currentItem) currentItem.classList.add('active');

            // Xác định chặng và mức tiền thưởng hiện tại
            let pool = [];
            if (currentLevel <= 5) {
                document.getElementById('stage-text').innerText = "Chặng 1: Khởi động";
                pool = questionBank.easy;
            } else if (currentLevel <= 10) {
                document.getElementById('stage-text').innerText = "Chặng 2: Tăng tốc";
                pool = questionBank.medium;
            } else {
                document.getElementById('stage-text').innerText = "Chặng 3: Về đích vinh quang";
                pool = questionBank.medium; // Sử dụng tiếp pool medium chất lượng cao nếu chưa có pool hard/extreme riêng biệt
            }
            document.getElementById('prize-text').innerText = `${milestones[currentLevel - 1]} VNĐ`;

            // Lọc câu hỏi chưa dùng
            let availableQuestions = pool.filter(q => !usedQuestions.includes(q.id));
            if (availableQuestions.length === 0) {
                availableQuestions = pool; // Đề phòng hết kho câu hỏi thì reset lại dữ liệu
            }

            currentQuestion = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
            usedQuestions.push(currentQuestion.id);

            // Hiển thị câu hỏi lên UI
            document.getElementById('question-display').innerText = `Câu ${currentLevel}: ${currentQuestion.q}`;
            for (let i = 0; i < 4; i++) {
                document.getElementById(`text-${i}`).innerText = currentQuestion.a[i];
            }

            startTimer();
        }

        function selectAnswer(index) {
            clearInterval(timerInterval);
            disableAllAnswers();

            const selectedCard = document.getElementById(`btn-${index}`);
            selectedCard.classList.add('selected');

            // Tạo khoảng dừng hồi hộp 1.2s chuẩn Gameshow truyền hình
            setTimeout(() => {
                selectedCard.classList.remove('selected');
                if (index === currentQuestion.c) {
                    selectedCard.classList.add('correct');
                    setTimeout(() => {
                        if (currentLevel === 15) {
                            showEndModal("CHIẾN THẮNG TUYỆT ĐỐI!", "Chúc mừng bạn đã xuất sắc vượt qua 15 câu hỏi và trở thành TRIỆU PHÚ với giải thưởng 150.000.000 VNĐ!");
                        } else {
                            currentLevel++;
                            loadQuestion();
                        }
                    }, 1500);
                } else {
                    selectedCard.classList.add('wrong');
                    document.getElementById(`btn-${currentQuestion.c}`).classList.add('correct');
                    setTimeout(() => {
                        let reward = "0 VNĐ";
                        if (currentLevel > 10) reward = milestones[9] + " VNĐ";
                        else if (currentLevel > 5) reward = milestones[4] + " VNĐ";
                        showEndModal("SAI RỒI!", `Rất tiếc, đáp án đúng là phương án dành cho ký tự phía trước câu hỏi. Bạn ra về với mốc điểm an toàn có trị giá: ${reward}.`);
                    }, 2000);
                }
            }, 1200);
        }

        /* HỆ THỐNG XỬ LÝ QUYỀN TRỢ GIÚP CHUYÊN NGHIỆP */
        function use5050() {
            markHelpUsed('wrap-5050');
            let correctIdx = currentQuestion.c;
            let incorrectIndices = [0, 1, 2, 3].filter(i => i !== correctIdx);
            
            // Xáo trộn ngẫu nhiên mảng câu sai và giữ lại 1 câu sai, ẩn đi 2 câu còn lại
            incorrectIndices.sort(() => Math.random() - 0.5);
            for(let i = 0; i < 2; i++) {
                let card = document.getElementById(`btn-${incorrectIndices[i]}`);
                card.style.visibility = 'hidden';
                card.classList.add('disabled');
            }
            showHelpPanel("Trợ giúp 50:50", "Hệ thống máy tính đã loại bỏ hai phương án sai cho bạn.");
        }

        function useCall() {
            markHelpUsed('wrap-call');
            const letters = ["A", "B", "C", "D"];
            let chosenLetter = "";
            
            // Tỷ lệ chuẩn xác của người thân là 80% ở các câu khởi đầu
            if (Math.random() < 0.8) {
                chosenLetter = letters[currentQuestion.c];
            } else {
                let options = [0,1,2,3].filter(i => i !== currentQuestion.c && !document.getElementById(`btn-${i}`).classList.contains('disabled'));
                chosenLetter = options.length > 0 ? letters[options[0]] : letters[currentQuestion.c];
            }
            showHelpPanel("Gọi điện thoại cho người thân", `📞 Người thân: "Theo mình biết thì đáp án chính xác của câu hỏi này khả năng cực kỳ cao là <strong>${chosenLetter}</strong> đấy!"`);
        }

        function useAudience() {
            markHelpUsed('wrap-audience');
            let cIdx = currentQuestion.c;
            let votes = [0, 0, 0, 0];
            
            // Lọc các phương án chưa bị ẩn bởi 50/50
            let activeIndices = [0,1,2,3].filter(i => !document.getElementById(`btn-${i}`).classList.contains('disabled'));
            
            let correctWeight = activeIndices.includes(cIdx) ? (currentLevel <= 5 ? 70 : 52) : 0;
            votes[cIdx] = Math.floor(Math.random() * 15) + correctWeight;
            
            let remaining = 100 - votes[cIdx];
            let restIndices = activeIndices.filter(i => i !== cIdx);
            
            if (restIndices.length === 1) {
                votes[restIndices[0]] = remaining;
            } else {
                restIndices.forEach((idx, i) => {
                    if (i === restIndices.length - 1) {
                        votes[idx] = remaining;
                    } else {
                        let share = Math.floor(Math.random() * remaining);
                        votes[idx] = share;
                        remaining -= share;
                    }
                });
            }

            // Vẽ biểu đồ cột CSS động trực quan ngay trong live-panel
            let htmlChart = `<div class="chart-container">`;
            const labels = ["A", "B", "C", "D"];
            for (let i = 0; i < 4; i++) {
                htmlChart += `
                    <div class="chart-column">
                        <div class="chart-bar" style="height: ${votes[i]}px;"></div>
                        <strong>${labels[i]}: ${votes[i]}%</strong>
                    </div>`;
            }
            htmlChart += `</div>`;
            showHelpPanel("Ý kiến của khán giả trong trường quay", htmlChart);
        }

        function useExpert() {
            markHelpUsed('wrap-expert');
            const letters = ["A", "B", "C", "D"];
            let cLabel = letters[currentQuestion.c];
            
            showHelpPanel("Tổ tư vấn chuyên gia tại chỗ", `
                🎓 Kết quả phân tích từ các vị chuyên gia:<br>
                - Chuyên gia Kinh tế: "Tôi khẳng định đáp án đúng ở đây là phương án <strong>${cLabel}</strong>."<br>
                - Chuyên gia Văn hóa: "Tôi đồng quan điểm, dữ liệu lịch sử hoàn toàn khớp với đáp án <strong>${cLabel}</strong>."
            `);
        }

        function stopGame() {
            clearInterval(timerInterval);
            let currentPrize = currentLevel > 1 ? milestones[currentLevel - 2] : "0";
            
            if (confirm(`Bạn có chắc chắn muốn dừng cuộc chơi tại đây để bảo toàn số tiền thưởng trị giá ${currentPrize} VNĐ?`)) {
                showEndModal("ĐÃ DỪNG CUỘC CHƠI", `Chúc mừng bạn đã hoàn thành phần thi và mang về số tiền an toàn: ${currentPrize} VNĐ.`);
            } else {
                // Tiếp tục đếm ngược nếu người chơi hủy lệnh dừng
                startTimer();
            }
        }

        // TIỆN ÍCH PHỤ TRỢ (HEALPERS)
        function markHelpUsed(id) {
            const wrap = document.getElementById(id);
            wrap.classList.add('used');
            wrap.querySelector('button').disabled = true;
        }

        function showHelpPanel(title, content) {
            const box = document.getElementById('live-help-box');
            document.getElementById('live-help-title').innerText = title;
            document.getElementById('live-help-content').innerHTML = content;
            box.style.display = 'block';
        }

        function hideHelpPanel() {
            document.getElementById('live-help-box').style.display = 'none';
        }

        function disableAllAnswers() {
            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn-${i}`).classList.add('disabled');
            }
        }

        function resetAnswerCards() {
            for (let i = 0; i < 4; i++) {
                const card = document.getElementById(`btn-${i}`);
                card.className = 'answer-card';
                card.style.visibility = 'visible';
            }
        }

        function showEndModal(title, description) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = description;
            document.getElementById('modal-btn').innerText = "CHƠI LẠI TRẬN MỚI";
            document.getElementById('game-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
