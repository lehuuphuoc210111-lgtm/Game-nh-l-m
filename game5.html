<!DOCTYPE html>

<head>

    <style>
        /* CSS giao diện đồng bộ với Game Hub của bạn */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0614;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .game-container {
            width: 90%;
            max-width: 800px;
            background: linear-gradient(135deg, #1f0c24 0%, #12051a 100%);
            border: 2px solid #ff4d88;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(255, 77, 136, 0.4);
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 77, 136, 0.3);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .lifelines {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .lifeline-btn {
            background: linear-gradient(135deg, #ff4d88, #ff1a66);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 26, 102, 0.3);
        }
        .lifeline-btn:hover:not(:disabled) {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ff6699, #ff3377);
        }
        .lifeline-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
        .sub-text {
            text-align: center;
            font-style: italic;
            color: #ffb3cc;
            margin-bottom: 15px;
        }
        .question-box {
            background: rgba(45, 15, 56, 0.7);
            border: 2px solid #ff4d88;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            font-size: 1.25rem;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(255, 77, 136, 0.2);
        }
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        @media (max-width: 600px) {
            .answers-grid {
                grid-template-columns: 1fr;
            }
        }
        .answer-btn {
            background: linear-gradient(135deg, #3d124e, #280a33);
            border: 2px solid #ff4d88;
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .answer-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #5c1b73, #3d124e);
            border-color: #ff99bb;
            transform: translateY(-2px);
        }
        .answer-btn.correct {
            background: linear-gradient(135deg, #28a745, #1e7e34) !important;
            border-color: #55efc4 !important;
        }
        .answer-btn.wrong {
            background: linear-gradient(135deg, #dc3545, #bd2130) !important;
            border-color: #ff7675 !important;
        }
        .footer-nav {
            text-align: center;
        }
        .back-link {
            color: #ffb3cc;
            text-decoration: none;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        /* Màn hình kết quả */
        .result-screen {
            text-align: center;
            padding: 20px;
        }
        .result-screen h2 {
            color: #ff4d88;
            margin-bottom: 15px;
            font-size: 2rem;
        }
        .result-screen p {
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: #ffb3cc;
        }
        .primary-btn {
            background: linear-gradient(135deg, #ff4d88, #ff1a66);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 26, 102, 0.4);
            transition: 0.3s;
        }
        .primary-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedFifty = false;

        // Hàm xáo trộn mảng (Fisher-Yates shuffle)
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Khởi tạo trò chơi: Trộn thứ tự câu hỏi và trộn các đáp án trong từng câu
        function initGame() {
            // Xáo trộn thứ tự các câu hỏi
            let shuffledQ = shuffleArray(rawQuestions);

            // Xáo trộn các đáp án của từng câu, đồng thời giữ vết đáp án đúng mới
            questions = shuffledQ.map(item => {
                let optionsWithIndex = item.options.map((opt, idx) => ({ text: opt, isCorrect: idx === item.correct }));
                let shuffledOptions = shuffleArray(optionsWithIndex);
                let newCorrectIndex = shuffledOptions.findIndex(opt => opt.isCorrect);

                return {
                    q: item.q,
                    options: shuffledOptions.map(opt => opt.text),
                    correct: newCorrectIndex
                };
            });

            currentIndex = 0;
            score = 0;
            selectedFifty = false;
            renderQuestion();
        }

        function renderQuestion() {
            const app = document.getElementById('game-app');
            
            if (currentIndex >= questions.length) {
                // Màn hình chiến thắng khi hoàn thành hết câu hỏi
                app.innerHTML = `
                    <div class="result-screen">
                        <h2>🏆 CHIẾN THẮNG TUYỆT ĐỐI!</h2>
                        <p>Bạn đã hoàn thành xuất sắc toàn bộ ${questions.length} câu hỏi về chủ đề 20/10!</p>
                        <p>Chúc một nửa thế giới luôn luôn hạnh phúc và rạng rỡ!</p>
                        <button class="primary-btn" onclick="initGame()">Chơi lại từ đầu</button>
                        <div style="margin-top: 15px;">
                            <a href="index.html" class="back-link">🏠 Quay lại Game Hub</a>
                        </div>
                    </div>
                `;
                return;
            }

            let currentQ = questions[currentIndex];

            app.innerHTML = `
                <div class="header">
                    <span>🌸 Ai Là Triệu Phú: Phiên Bản 20/10</span>
                    <span>Câu ${currentIndex + 1}/${questions.length}</span>
                </div>
                <div class="lifelines">
                    <button class="lifeline-btn" id="btn-5050" onclick="useFiftyFifty()" ${selectedFifty ? 'disabled' : ''}>50:50</button>
                    <button class="lifeline-btn" onclick="useCallFriend()">📞 Gọi điện</button>
                    <button class="lifeline-btn" onclick="useAudience()">👥 Khán giả</button>
                    <button class="lifeline-btn" onclick="useChangeQuestion()">🔄 Đổi câu hỏi</button>
                </div>
                <div class="sub-text">Hãy chọn đáp án chính xác nhất!</div>
                <div class="question-box" id="q-text">${currentQ.q}</div>
                <div class="answers-grid" id="answers-container">
                    <button class="answer-btn" onclick="checkAnswer(0)" id="ans-0">A. ${currentQ.options[0]}</button>
                    <button class="answer-btn" onclick="checkAnswer(1)" id="ans-1">B. ${currentQ.options[1]}</button>
                    <button class="answer-btn" onclick="checkAnswer(2)" id="ans-2">C. ${currentQ.options[2]}</button>
                    <button class="answer-btn" onclick="checkAnswer(3)" id="ans-3">D. ${currentQ.options[3]}</button>
                </div>
                <div class="footer-nav">
                    <a href="index.html" class="back-link">← Quay lại Game Hub</a>
                </div>
            `;
        }

        function checkAnswer(selectedIndex) {
            let currentQ = questions[currentIndex];
            let correctIndex = currentQ.correct;

            // Khóa tất cả nút đáp án để tránh click đúp
            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`ans-${i}`);
                if(btn) btn.disabled = true;
            }

            let selectedBtn = document.getElementById(`ans-${selectedIndex}`);
            let correctBtn = document.getElementById(`ans-${correctIndex}`);

            if (selectedIndex === correctIndex) {
                selectedBtn.classList.add('correct');
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                correctBtn.classList.add('correct');
            }

            // Chờ 1.5 giây rồi tự động chuyển sang câu hỏi tiếp theo
            setTimeout(() => {
                currentIndex++;
                renderQuestion();
            }, 1500);
        }

        // Tính năng trợ giúp 50:50
        function useFiftyFifty() {
            if (selectedFifty) return;
            selectedFifty = true;
            document.getElementById('btn-5050').disabled = true;

            let currentQ = questions[currentIndex];
            let correctIndex = currentQ.correct;
            let wrongIndices = [];
            for (let i = 0; i < 4; i++) {
                if (i !== correctIndex) wrongIndices.push(i);
            }
            // Ẩn ngẫu nhiên 2 đáp án sai
            shuffleArray(wrongIndices).slice(0, 2).forEach(idx => {
                let btn = document.getElementById(`ans-${idx}`);
                if (btn) {
                    btn.innerHTML = "";
                    btn.style.visibility = "hidden";
                    btn.disabled = true;
                }
            });
        }

        function useCallFriend() {
            let currentQ = questions[currentIndex];
            let letters = ['A', 'B', 'C', 'D'];
            alert(`📞 Người thân gợi ý: Theo mình đáp án chính xác có khả năng cao là ${letters[currentQ.correct]}.`);
        }

        function useAudience() {
            let currentQ = questions[currentIndex];
            let letters = ['A', 'B', 'C', 'D'];
            alert(`👥 Ý kiến khán giả trong trường quay:\n- ${letters[currentQ.correct]}: 75%\n- Các đáp án còn lại: 25%`);
        }

        function useChangeQuestion() {
            // Đưa câu hỏi hiện tại xuống cuối danh sách và load câu tiếp theo
            let currentQ = questions.splice(currentIndex, 1)[0];
            questions.push(currentQ);
            renderQuestion();
        }

        // Khởi chạy game lần đầu
        initGame();
    </script>
