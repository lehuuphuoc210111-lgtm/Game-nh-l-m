<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Kiến Thức - Game Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .quiz-container {
            background: #ffffff;
            width: 100%;
            max-width: 700px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            padding: 30px;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .quiz-header h2 {
            color: #333;
            font-size: 22px;
        }
        .badge {
            background: #ffc107;
            color: #333;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .question-box {
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 18px;
            color: #2c3e50;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .options-list {
            list-style: none;
        }
        .option-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            color: #495057;
        }
        .option-item:hover {
            background: #e2e6ea;
            border-color: #cbd3da;
        }
        .option-item.selected {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .option-item.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724 !important;
        }
        .option-item.wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
        }
        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5a62d5;
        }
        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .score-container {
            text-align: center;
            display: none;
        }
        .score-container h2 {
            font-size: 26px;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .score-container p {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Khu vực làm bài quiz -->
        <div id="quiz-box">
            <div class="quiz-header">
                <h2 id="question-count">Câu hỏi 1 / 130</h2>
                <span id="question-level" class="badge">Dễ</span>
            </div>
            <div class="question-box">
                <p id="question-text" class="question-text">Đang tải câu hỏi...</p>
                <ul id="options-list" class="options-list">
                    <!-- Các lựa chọn sẽ được render bằng JS -->
                </ul>
            </div>
            <div class="quiz-footer">
                <span id="score-tracker">Điểm: 0</span>
                <button id="next-btn" class="btn" onclick="nextQuestion()" disabled>Câu tiếp theo</button>
            </div>
        </div>

        <!-- Khu vực hiển thị kết quả cuối cùng -->
        <div id="result-box" class="score-container">
            <h2>Hoàn thành xuất sắc! 🎉</h2>
            <p id="final-score-text">Bạn đã trả lời đúng X / 130 câu hỏi.</p>
            <button class="btn" onclick="restartQuiz()">Làm lại từ đầu</button>
        </div>
    </div>

    <script>
        const quizData = [
            // --- CẤP ĐỘ 1: DỄ (Câu 51 - 70) ---
            { id: 51, level: "Dễ", question: "Đâu là tên một bài hát rất quen thuộc của nhạc sĩ Nguyễn Văn Tý viết về người phụ nữ đảm đang?", options: ["Dáng đứng Bến Tre", "Người con gái sông La", "Mẹ yêu con", "Bài ca phụ nữ Việt Nam"], answer: "Dáng đứng Bến Tre" },
            { id: 52, level: "Dễ", question: "Đâu là tên một bộ phim truyền hình nổi tiếng của Việt Nam kể về cuộc sống của bốn mẹ con trong một gia đình?", options: ["Sống chung với mẹ chồng", "Thương ngày nắng về", "Về nhà đi con", "Hướng dương ngược nắng"], answer: "Thương ngày nắng về" },
            { id: 53, level: "Dễ", question: "Điền từ còn thiếu vào câu ca dao sau: \"Công cha như núi Thái Sơn, nghĩa ... như nước trong nguồn chảy ra\"?", options: ["Thầy", "Cô", "Mẹ", "Anh"], answer: "Mẹ" },
            { id: 54, level: "Dễ", question: "Loại quả nào thường được ví với hình ảnh người phụ nữ mang bầu trong câu đố dân gian: \"Da cóc mà bọc trứng gà...\"?", options: ["Quả mít", "Quả sầu riêng", "Quả na", "Quả mít mật"], answer: "Quả na" },
            { id: 55, level: "Dễ", question: "Lễ hội nào sau đây thường có hoạt động tôn vinh và cài hoa hồng lên ngực áo để bày tỏ lòng hiếu thảo với mẹ?", options: ["Lễ Vu Lan", "Lễ Trung thu", "Lễ Thất tịch", "Lễ Phật đản"], answer: "Lễ Vu Lan" },
            { id: 56, level: "Dễ", question: "Truyện cổ tích nào kể về một người vợ vì chung thủy chờ chồng đi lính đến mức hóa thành đá?", options: ["Sự tích trầu cau", "Sự tích hòn Vọng Phu", "Sự tích hồ Ba Bể", "Chuyện người con gái Nam Xương"], answer: "Sự tích hòn Vọng Phu" },
            { id: 57, level: "Dễ", question: "Trong ngày 20/10, phái nam thường làm hành động nào sau đây để thể hiện sự quan tâm đến người phụ nữ mình yêu thương?", options: ["Tặng hoa và quà", "Đi ngủ sớm", "Đòi quà ngược lại", "Tắt điện thoại cả ngày"], answer: "Tặng hoa và quà" },
            { id: 58, level: "Dễ", question: "Đâu là tên một bài hát tiếng Anh bất hủ về người mẹ của nhóm nhạc Spice Girls?", options: ["Mama", "Mother", "Goodbye", "Wannabe"], answer: "Mama" },
            { id: 59, level: "Dễ", question: "Trong bài thơ \"Hạt gạo làng ta\" của Trần Đăng Khoa, người mẹ đã phải lội xuống ruộng cấy lúa trong thời tiết như thế nào?", options: ["Giữa trưa tháng sáu nồng nặc", "Trời mưa bão bùng", "Đêm đông lạnh giá", "Sương mù sáng sớm"], answer: "Giữa trưa tháng sáu nồng nặc" },
            { id: 60, level: "Dễ", question: "Nhân vật người mẹ trong truyện cổ tích \"Thạch Sanh\" đã qua đời vì lý do gì sau khi sinh Thạch Sanh?", options: ["Bị bệnh nặng vì nghèo khổ", "Bị chằn tinh hại", "Bị ngã xuống suối", "Đi làm nương rẫy bị lạc"], answer: "Bị bệnh nặng vì nghèo khổ" },
            { id: 61, level: "Dễ", question: "Từ nào sau đây thường được dùng để gọi người phụ nữ sinh ra bố hoặc mẹ của mình?", options: ["Bà", "Cô", "Dì", "Mợ"], answer: "Bà" },
            { id: 62, level: "Dễ", question: "Điền từ còn thiếu vào câu thành ngữ phản ánh tình cảm khăng khít: \"Chị ngã em ...\"?", options: ["Nâng", "Đỡ", "Cười", "Nhìn"], answer: "Nâng" },
            { id: 63, level: "Dễ", question: "Đâu là tên một tác phẩm truyện tranh và hoạt hình nổi tiếng thế giới kể về một cô bé mồ côi tóc đỏ sống ở trang trại?", options: ["Anne tóc đỏ dưới chái nhà xanh", "Lọ Lem", "Công chúa tóc mây", "Cô bé bán diêm"], answer: "Anne tóc đỏ dưới chái nhà xanh" },
            { id: 64, level: "Dễ", question: "Trong ngày Tết Trung thu, nhân vật nữ nào thường được nhắc đến cùng với chú Cuội trên Mặt Trăng?", options: ["Chị Hằng", "Bà Chúa Kho", "Thánh Mẫu", "Cô Tấm"], answer: "Chị Hằng" },
            { id: 65, level: "Dễ", question: "Món ăn nào sau đây thường được các mẹ nấu trong ngày Tết Đoan Ngọ (5/5 âm lịch) để \"diệt sâu bọ\" theo truyền thống miền Bắc?", options: ["Rượu nếp và bánh tro", "Bánh chưng", "Bánh trôi bánh chay", "Chè khoai môn"], answer: "Rượu nếp và bánh tro" },
            { id: 66, level: "Dễ", question: "Trong bài thơ \"Bếp lửa\" của Bằng Việt, người bà đã cùng cháu nhóm lên bếp lửa trong suốt bao nhiêu năm chung sống?", options: ["4 năm", "8 năm", "10 năm", "12 năm"], answer: "8 năm" },
            { id: 67, level: "Dễ", question: "Khi viết thiệp chúc mừng ngày 20/10 cho cô giáo, từ xưng hô nào thường được học sinh sử dụng trang trọng nhất?", options: ["Kính gửi Cô", "Chào Cô", "Gửi Bạn", "Thân gửi Chị"], answer: "Kính gửi Cô" },
            { id: 68, level: "Dễ", question: "Bộ phim hoạt hình nào của Disney kể về một cô gái dũng cảm cải trang thành nam giới để thay cha đi tòng quân?", options: ["Hoa Mộc Lan (Mulan)", "Người đẹp và Quái vật (Beauty and the Beast)", "Nàng tiên cá (The Little Mermaid)", "Công chúa ngủ trong rừng (Sleeping Beauty)"], answer: "Hoa Mộc Lan (Mulan)" },
            { id: 69, level: "Dễ", question: "Điền từ còn thiếu vào câu thành ngữ nói về tài nội trợ của người phụ nữ: \"Đàn ông xây nhà, đàn bà xây ...\"?", options: ["Tổ ấm", "Gian bếp", "Hạnh phúc", "Tương lai"], answer: "Tổ ấm" },
            { id: 70, level: "Dễ", question: "Đâu là tên một bài hát thiếu nhi rất nổi tiếng của nhạc sĩ Phan Huỳnh Điểu ca ngợi tình cảm của cô giáo và mẹ đối với bé?", options: ["Ngày đầu tiên đi học", "Cô và mẹ", "Đi học", "Bụi phấn"], answer: "Cô và mẹ" },

            // --- CẤP ĐỘ 3: KHÁ (Câu 71 - 90) ---
            { id: 71, level: "Khá", question: "Tác phẩm văn học nổi tiếng \"Hòn Đất\" của nhà văn Anh Đức viết về cuộc chiến đấu anh dũng của một nữ du kích có tên là gì?", options: ["Chị Sứ", "Chị Út Tịch", "Chị Út Tố", "Chị Lê Thị Hồng Gấm"], answer: "Chị Sứ" },
            { id: 72, level: "Khá", question: "Đại hội đại biểu Phụ nữ toàn quốc lần thứ nhất (tháng 4/1950) đã bầu ai làm Chủ tịch chính thức đầu tiên của Hội Liên hiệp Phụ nữ Việt Nam?", options: ["Lê Thị Xuyến", "Nguyễn Thị Thập", "Hà Thị Quế", "Nguyễn Thị Minh Khai"], answer: "Lê Thị Xuyến" },
            { id: 73, level: "Khá", question: "Trong bài thơ nổi tiếng \"Núi Đôi\" của nhà thơ Vũ Cao, nhân vật nữ liệt sĩ được lấy nguyên mẫu từ ai ngoài đời thực?", options: ["Trần Thị Bắc", "Võ Thị Sáu", "Nguyễn Thị Chiên", "Bùi Thị Cúc"], answer: "Trần Thị Bắc" },
            { id: 74, level: "Khá", question: "Trong thần thoại Hy Lạp, vị nữ thần nào được sinh ra từ bọt biển và là biểu tượng của tình yêu, sắc đẹp?", options: ["Athena", "Aphrodite", "Artemis", "Hera"], answer: "Aphrodite" },
            { id: 75, level: "Khá", question: "Trong văn hóa dân gian Việt Nam, lễ hội Đền Hai Bà Trưng (Mê Linh, Hà Nội) chính thức được tổ chức vào ngày nào âm lịch hàng năm?", options: ["Mùng 6 tháng Giêng", "Mùng 10 tháng Ba", "Rằm tháng Tám", "Mùng 3 tháng Ba"], answer: "Mùng 6 tháng Giêng" },
            { id: 76, level: "Khá", question: "Cuốn tiểu thuyết kinh điển \"Trở về Ê-đên\" là sáng tác của nữ tác giả nào?", options: ["Margaret Mitchell", "Rosalind Miles", "Colleen McCullough", "Agatha Christie"], answer: "Rosalind Miles" },
            { id: 77, level: "Khá", question: "Nữ thi sĩ nào là tác giả của bài thơ \"Bánh trôi nước\", mượn hình ảnh chiếc bánh để nói về thân phận chìm nổi của người phụ nữ xưa?", options: ["Hồ Xuân Hương", "Bà Huyện Thanh Quan", "Đoàn Thị Điểm", "Xuân Quỳnh"], answer: "Hồ Xuân Hương" },
            { id: 78, level: "Khá", question: "Ai là nữ vận động viên đầu tiên trong lịch sử thể thao Việt Nam giành được Huy chương Bạc tại một kỳ Thế vận hội Olympic?", options: ["Trần Hiếu Ngân", "Nguyễn Thị Ánh Viên", "Lê Tú Chinh", "Hoàng Xuân Vinh"], answer: "Trần Hiếu Ngân" },
            { id: 79, level: "Khá", question: "Trong văn học trung đại Việt Nam, nhân vật Thúy Kiều mang họ gì?", options: ["Vương", "Nguyễn", "Thúc", "Kim"], answer: "Vương" },
            { id: 80, level: "Khá", question: "\"Tứ bất tử\" trong tín ngưỡng dân gian Việt Nam bao gồm ba vị nam thần và một vị nữ thần duy nhất. Vị nữ thần đó là ai?", options: ["Thánh Mẫu Liễu Hạnh", "Thiên Y A Na", "Bà Chúa Kho", "Mẫu Thượng Ngàn"], answer: "Thánh Mẫu Liễu Hạnh" },
            { id: 81, level: "Khá", question: "Nữ anh hùng nào được nhắc đến trong câu hát: \"Người con gái trẻ măng, giặc đổ súng vào lòng chị nát, chị vẫn đứng vững vàng như một nhành mai\"?", options: ["Võ Thị Sáu", "Lê Thị Hồng Gấm", "Nguyễn Thị Minh Khai", "Mạc Thị Bưởi"], answer: "Lê Thị Hồng Gấm" },
            { id: 82, level: "Khá", question: "Quốc gia Đông Nam Á nào có nữ Tổng thống đầu tiên là con gái của vị Tổng thống lập quốc?", options: ["Philippines", "Indonesia", "Thái Lan", "Singapore"], answer: "Indonesia" },
            { id: 83, level: "Khá", question: "Trong tác phẩm \"Vợ nhặt\" của Kim Lân, nhân vật \"thị\" theo Tràng về làm vợ chỉ sau khi được ăn mấy bát bánh đúc?", options: ["Hai bát", "Ba bát", "Bốn bát", "Năm bát"], answer: "Bốn bát" },
            { id: 84, level: "Khá", question: "Nữ văn sĩ người Anh J.K. Rowling đã viết trọn vẹn bộ tiểu thuyết bom tấn Harry Potter gồm bao nhiêu tập truyện chính thức?", options: ["6 tập", "7 tập", "8 tập", "9 tập"], answer: "7 tập" },
            { id: 85, level: "Khá", question: "Ai là tác giả của bức tranh sơn dầu nổi tiếng \"Thiếu nữ bên hoa huệ\" - một biểu tượng cho vẻ đẹp thanh lịch của người con gái Hà Thành xưa?", options: ["Tô Ngọc Vân", "Bùi Xuân Phái", "Nguyễn Gia Trí", "Trần Văn Cẩn"], answer: "Tô Ngọc Vân" },
            { id: 86, level: "Khá", question: "Công chúa Huyền Trân, người có vai trò lịch sử to lớn trong việc mở rộng bờ cõi về phương Nam, là con gái của vị vua nào nhà Trần?", options: ["Trần Nhân Tông", "Trần Thánh Tông", "Trần Thái Tông", "Trần Anh Tông"], answer: "Trần Nhân Tông" },
            { id: 87, level: "Khá", question: "Giải thưởng cao quý mang tên một nữ giáo sư, nhà toán học nổi tiếng của Việt Nam dùng để trao tặng cho các nhà khoa học nữ xuất sắc là giải gì?", options: ["Giải thưởng Kovalevskaia", "Giải thưởng Tạ Quang Bửu", "Giải thưởng Hồ Chí Minh", "Giải thưởng L'Oréal-UNESCO"], answer: "Giải thưởng Kovalevskaia" },
            { id: 88, level: "Khá", question: "Điền từ còn thiếu vào câu khẩu hiệu truyền thống của phong trào phụ nữ \"Ba đảm đang\": \"Đảm đang sản xuất và công tác; Đảm đang gia đình; Đảm đang ...\"?", options: ["Phục vụ chiến đấu", "Học tập tiến bộ", "Nuôi dạy con ngoan", "Tăng gia sản xuất"], answer: "Phục vụ chiến đấu" },
            { id: 89, level: "Khá", question: "Ca khúc \"Mẹ Việt Nam anh hùng\" với câu hát mở đầu \"Mẹ về đứng dưới mưa, che từng căn nhà nhỏ...\" là một sáng tác của nhạc sĩ nào?", options: ["An Thuyên", "Phan Huỳnh Điểu", "Trịnh Công Sơn", "Xuân Hồng"], answer: "An Thuyên" },
            { id: 90, level: "Khá", question: "Bộ phim kinh điển \"Cuốn theo chiều gió\" xoay quanh cuộc đời kiên cường vượt qua chiến tranh của nữ nhân vật chính tên là gì?", options: ["Scarlett O'Hara", "Melanie Hamilton", "Jane Eyre", "Elizabeth Bennet"], answer: "Scarlett O'Hara" },

            // --- CẤP ĐỘ 5: CỰC KHÓ (Câu 91 - 130) ---
            { id: 91, level: "Cực khó", question: "Trận đánh lịch sử nào chứng kiến sự hy sinh anh dũng của nữ anh hùng Nguyễn Thị Út (Út Tịch) cùng người con gái thứ ba vào năm 1968?", options: ["Trận Trà Ôn", "Trận Tam Ngãi", "Trận Cầu Kè", "Trận Kinh Bùi"], answer: "Trận Tam Ngãi" },
            { id: 92, level: "Cực khó", question: "Theo \"Đại Việt sử ký toàn thư\", vị hoàng hậu nào trong lịch sử nước ta là người duy nhất được phong tặng danh hiệu cao quý \"Phụ đạo Đại vương\" sau khi qua đời?", options: ["Linh Nhân Hoàng hậu (Nguyên phi Ỷ Lan)", "Thượng Dương Hoàng hậu", "Chiêu Thánh Hoàng hậu (Lý Chiêu Hoàng)", "Bảo Từ Hoàng hậu"], answer: "Linh Nhân Hoàng hậu (Nguyên phi Ỷ Lan)" },
            { id: 93, level: "Cực khó", question: "Người phụ nữ đầu tiên trên thế giới đoạt giải Fields (giải Nobel Toán học) vào năm 2014 là nhà toán học người nước nào?", options: ["Iran", "Pháp", "Đức", "Hoa Kỳ"], answer: "Iran" },
            { id: 94, level: "Cực khó", question: "Tập thơ chữ Nôm \"Cung oán ngâm khúc\" của Nguyễn Gia Thiều sử dụng thể thơ nào làm ngôn ngữ diễn đạt chính?", options: ["Song thất lục bát", "Lục bát", "Thất ngôn bát cú Đường luật", "Thất ngôn trường thiên"], answer: "Song thất lục bát" },
            { id: 95, level: "Cực khó", question: "Trong phong trào Tây Sơn, nữ tướng Bùi Thị Xuân nổi tiếng với việc huấn luyện và chỉ huy đội quân độc đáo nào ra trận?", options: ["Đội tượng binh (voi chiến)", "Đội thiết kỵ binh", "Đội nữ binh chủng pháo thủ", "Đội thủy binh cảm tử"], answer: "Đội tượng binh (voi chiến)" },
            { id: 96, level: "Cực khó", question: "Ai là người phụ nữ đầu tiên nắm giữ vị trí Tổng Giám đốc Tổ chức Thương mại Thế giới (WTO)?", options: ["Ngozi Okonjo-Iweala", "Christine Lagarde", "Kristalina Georgieva", "Ursula von der Leyen"], answer: "Ngozi Okonjo-Iweala" },
            { id: 97, level: "Cực khó", question: "Trong tác phẩm cổ điển \"Truyện Kiều\", Nguyễn Du đã miêu tả tổng cộng bao nhiêu năm trôi dạt, phong trần của Thúy Kiều trước khi được đoàn tụ gia đình?", options: ["10 năm", "12 năm", "15 năm", "18 năm"], answer: "15 năm" },
            { id: 98, level: "Cực khó", question: "Vị nữ vương duy nhất cai trị vương triều cổ đại Palmyra (thuộc Syria ngày nay), người từng cả gan thách thức Đế quốc La Mã là ai?", options: ["Nữ vương Zenobia", "Nữ hoàng Cleopatra", "Nữ vương Boudica", "Nữ hoàng Nefertiti"], answer: "Nữ vương Zenobia" },

            { id: 100, level: "Cực khó", question: "Nguyên mẫu nhân vật \"Mẹ Suốt\" kiên cường chèo đò chở bộ đội qua sông dưới mưa bom bão đạn nằm ở con sông nào thuộc tỉnh Quảng Bình?", options: ["Sông Nhật Lệ", "Sông Gianh", "Sông Kiến Giang", "Sông Long Đại"], answer: "Sông Nhật Lệ" },
            { id: 101, level: "Cực khó", question: "Bức thư tuyệt mệnh nổi tiếng của nữ bác sĩ, liệt sĩ Đặng Thùy Trâm được viết vào ngày tháng năm nào, trước khi bà hy sinh một ngày?", options: ["21/06/1970", "22/06/1970", "30/04/1975", "20/12/1969"], answer: "21/06/1970" },

            { id: 105, level: "Cực khó", question: "Nhà văn nữ đầu tiên trên thế giới đoạt giải Nobel Văn học (vào năm 1909) là Selma Lagerlöf. Bà là người quốc gia nào?", options: ["Thụy Điển", "Na Uy", "Đan Mạch", "Phần Lan"], answer: "Thụy Điển" },
            { id: 106, level: "Cực khó", question: "\"Lục súc tranh công\" là một truyện thơ ngụ ngôn khuyết danh tài hoa của Việt Nam. Cuộc tranh công này nổ ra giữa bao nhiêu con vật trong nhà?", options: ["6 con vật", "4 con vật", "5 con vật", "3 con vật"], answer: "6 con vật" },

            { id: 111, level: "Cực khó", question: "Việt Nam có các di sản tư liệu thế giới nào của UNESCO liên quan trực tiếp đến thơ văn chữ Nôm của các nữ sĩ?", options: ["Chưa có tập thơ cá nhân riêng biệt nào của nữ sĩ được công nhận là Di sản tư liệu toàn cầu/khu vực độc lập", "Tập thơ Hồ Xuân Hương", "Truyện Kiều", "Đoàn Thị Điểm tác phẩm"], answer: "Chưa có tập thơ cá nhân riêng biệt nào của nữ sĩ được công nhận là Di sản tư liệu toàn cầu/khu vực độc lập" },
            { id: 112, level: "Cực khó", question: "Ai là người phụ nữ đầu tiên trên thế giới giành được giải thưởng Pritzker – \"Nobel của ngành Kiến trúc\" vào năm 2004?", options: ["Zaha Hadid", "Kazuyo Sejima", "Carme Pigem", "Jeanne Gang"], answer: "Zaha Hadid" },
            { id: 113, level: "Cực khó", question: "Triều đại nào ở Việt Nam đã lần đầu tiên chính thức tổ chức một cuộc thi tuyển chọn \"Nữ quan\" (các quan bà trong cung) thông qua thi cử chữ nghĩa?", options: ["Nhà Lê sơ", "Nhà Lý", "Nhà Trần", "Nhà Nguyễn"], answer: "Nhà Lê sơ" },
            { id: 114, level: "Cực khó", question: "Ai là nữ nguyên thủ quốc gia đầu tiên của châu Phi được bầu cử dân chủ (Tổng thống Liberia từ 2006 đến 2018) và từng đạt giải Nobel Hòa bình?", options: ["Ellen Johnson Sirleaf", "Sahle-Work Zewde", "Samia Suluhu Hassan", "Joyce Banda"], answer: "Ellen Johnson Sirleaf" },
            { id: 115, level: "Cực khó", question: "Nữ anh hùng Lê Chân (nữ tướng của Hai Bà Trưng) đã chọn vùng đất nào làm căn cứ chiêu mộ binh sĩ, nay là trung tâm thành phố nào?", options: ["Hải Phòng", "Quảng Ninh", "Nam Định", "Thanh Hóa"], answer: "Hải Phòng" },
            { id: 116, level: "Cực khó", question: "Nhà sinh học phân tử nữ người Anh nào là người trực tiếp chụp được bức ảnh \"Photo 51\" bằng tia X – bằng chứng giúp khám phá cấu trúc DNA?", options: ["Rosalind Franklin", "Barbara McClintock", "Gerty Cori", "Dorothy Hodgkin"], answer: "Rosalind Franklin" },
            { id: 117, level: "Cực khó", question: "Vị nữ thần nào trong văn hóa tâm linh của người dân Nam Bộ được coi là hiện thân của nữ thần Pô Inư Nagar trong sự giao thoa Việt - Chăm?", options: ["Linh Sơn Thánh Mẫu (Bà Đen)", "Bà Chúa Xứ Núi Sam", "Bà Ngũ Hành", "Mẫu Thượng Ngàn"], answer: "Linh Sơn Thánh Mẫu (Bà Đen)" },
            { id: 118, level: "Cực khó", question: "Ai là nữ nhà văn đầu tiên của thế giới viết nên cuốn tiểu thuyết được công nhận rộng rãi là đầu tiên trong lịch sử nhân loại – \"Truyện kể Genji\"?", options: ["Murasaki Shikibu", "Sei Shonagon", "Ono no Komachi", "Higuchi Ichiyo"], answer: "Murasaki Shikibu" },
            { id: 119, level: "Cực khó", question: "Nhân vật nữ biểu tượng lịch sử nào của Việt Nam gắn liền với bức ảnh nổi tiếng \"Em bé Napalm\"?", options: ["Kim Phúc", "Không có phương án nào đúng trong danh sách này", "Đặng Thùy Trâm", "Võ Thị Sáu"], answer: "Không có phương án nào đúng trong danh sách này" },
            { id: 120, level: "Cực khó", question: "Trong \"Truyện Kiều\", nhân vật Hoạn Thư là con gái của một vị quan giữ chức vụ gì trong triều đình?", options: ["Thượng thư", "Tri phủ", "Tể tướng", "Thái sư"], answer: "Thượng thư" },
            { id: 121, level: "Cực khó", question: "Người phụ nữ đầu tiên giữ chức vụ Thủ tướng của một quốc gia Hồi giáo trong lịch sử hiện đại là ai?", options: ["Benazir Bhutto", "Khaleda Zia", "Sheikh Hasina", "Tansu Çiller"], answer: "Benazir Bhutto" },
            { id: 122, level: "Cực khó", question: "Bộ luật Hồng Đức (Quốc triều hình luật) quy định chồng lơ là vợ không đi lại trong bao lâu thì người vợ có quyền ly dị?", options: ["5 tháng", "1 năm", "3 năm", "5 năm"], answer: "5 tháng" },
            { id: 123, level: "Cực khó", question: "Vị hoàng hậu nào của triều đại nhà Nguyễn đã phá vỡ thông lệ để được phong hậu ngay trong ngày cưới vua Bảo Đại?", options: ["Nam Phương Hoàng hậu", "Thừa Thiên Cao Hoàng hậu", "Thuận Thiên Cao Hoàng hậu", "Từ Dụ Hoàng thái hậu"], answer: "Nam Phương Hoàng hậu" },
            { id: 124, level: "Cực khó", question: "Tác phẩm điêu khắc cổ đại \"Vệ nữ thành Milo\" (Venus de Milo) hiện đang được lưu giữ tại bảo tàng quốc gia nào?", options: ["Bảo tàng Louvre (Pháp)", "Bảo tàng Anh (British Museum)", "Bảo tàng Vatican (Ý)", "Bảo tàng Quốc gia Hy Lạp"], answer: "Bảo tàng Louvre (Pháp)" },
            { id: 125, level: "Cực khó", question: "Người phụ nữ duy nhất trong lịch sử từng được bổ nhiệm làm Chánh án Tòa án Tối cao của Vương quốc Anh là ai?", options: ["Brenda Hale", "Elisabeth Laing", "Sue Carr", "Rose Heilbron"], answer: "Brenda Hale" },
            { id: 126, level: "Cực khó", question: "Ai là tác giả nữ đầu tiên đoạt giải Pulitzer cho tác phẩm hư cấu vào năm 1921 với cuốn tiểu thuyết \"Thời thơ ngây\"?", options: ["Edith Wharton", "Willa Cather", "Edna Ferber", "Pearl S. Buck"], answer: "Edith Wharton" },
            { id: 127, level: "Cực khó", question: "Trong thần thoại Ai Cập, vị nữ thần nào là bảo hộ của bà mẹ, trẻ em, phép thuật và là vợ của thần chết Osiris?", options: ["Isis", "Nephthys", "Bastet", "Sekhmet"], answer: "Isis" },
            { id: 128, level: "Cực khó", question: "Nữ phi hành gia nào giữ kỷ lục là người phụ nữ có tổng thời gian sinh sống và làm việc liên tục ngoài không gian dài nhất trong một chuyến bay (328 ngày)?", options: ["Christina Koch", "Peggy Whitson", "Jessica Meir", "Sunita Williams"], answer: "Christina Koch" },
            { id: 129, level: "Cực khó", question: "Nhà văn nữ xuất sắc nào là người đầu tiên dịch trọn vẹn tác phẩm kinh điển \"Thần khúc\" của Dante sang tiếng Anh hiện đại?", options: ["Dorothy L. Sayers", "Virginia Woolf", "George Eliot", "Mary Shelley"], answer: "Dorothy L. Sayers" },
            { id: 130, level: "Cực khó", question: "Trong lịch sử phong kiến Trung Quốc, vị nữ hoàng duy nhất lập ra triều đại của riêng mình (triều Võ Chu) đã tự tạo ra chữ gì để đặt tên cho mình?", options: ["Chiếu (曌)", "Hậu (后)", "Thiên (天)", "Minh (明)"], answer: "Chiếu (曌)" }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionCountEl = document.getElementById("question-count");
        const questionLevelEl = document.getElementById("question-level");
        const questionTextEl = document.getElementById("question-text");
        const optionsListEl = document.getElementById("options-list");
        const scoreTrackerEl = document.getElementById("score-tracker");
        const nextBtn = document.getElementById("next-btn");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const finalScoreText = document.getElementById("final-score-text");

        function loadQuestion() {
            answered = false;
            nextBtn.disabled = true;
            
            const currentQ = quizData[currentQuestionIndex];
            questionCountEl.innerText = `Câu hỏi ${currentQuestionIndex + 1} / ${quizData.length}`;
            questionLevelEl.innerText = currentQ.level;
            questionTextEl.innerText = currentQ.question;
            
            optionsListEl.innerHTML = "";
            
            // Xáo trộn ngẫu nhiên các đáp án để trò chơi thú vị hơn
            const shuffledOptions = [...currentQ.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(option => {
                const li = document.createElement("li");
                li.classList.add("option-item");
                li.innerText = option;
                li.onclick = () => selectOption(li, option, currentQ.answer);
                optionsListEl.appendChild(li);
            });
        }

        function selectOption(selectedLi, selectedAnswer, correctAnswer) {
            if (answered) return;
            answered = true;

            const allOptions = optionsListEl.getElementsByTagName("li");
            for (let li of allOptions) {
                if (li.innerText === correctAnswer) {
                    li.classList.add("correct");
                }
                if (li === selectedLi && selectedAnswer !== correctAnswer) {
                    li.classList.add("wrong");
                }
                li.style.cursor = "default";
            }

            if (selectedAnswer === correctAnswer) {
                score++;
                scoreTrackerEl.innerText = `Điểm: ${score}`;
            }

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizBox.style.display = "none";
            resultBox.style.display = "block";
            finalScoreText.innerText = `Bạn đã trả lời đúng ${score} / ${quizData.length} câu hỏi.`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            scoreTrackerEl.innerText = `Điểm: ${score}`;
            quizBox.style.display = "block";
            resultBox.style.display = "none";
            loadQuestion();
        }

        // Khởi chạy câu hỏi đầu tiên khi mở trang
        loadQuestion();
    </script>
</body>
